<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Subscription</title>
    <meta name="description" content="About Neuroreg.net">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://www.neuroreg.net/about.html">

    <!-- Global + Page Styles -->
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/subscription.css">
    <link rel="apple-touch-icon" href="./icon180.png">

<body>

    <div id="hamburgerMenu" class="hamburgerIcon">☰</div>
    <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>

    <div id="topRightIcons"></div>

    <h1>Subscription</h1>

    <section class="content-section">
        <div class="container">

            <div class="subscription-card">

                <h2>NeuroReg Membership</h2>

                <p>
                    A NeuroReg subscription provides access to all educational content,
                    question banks and the Email-a-Question service.
                </p>

                <div class="subscription-status">

                    <h3>Current Status</h3>

                    <p>
                        Status:
                        <strong id="subscriptionStatus">Loading...</strong>
                    </p>

                    <p>
                        Expiry Date:
                        <strong id="subscriptionExpiry">-</strong>
                    </p>

                </div>

                <div class="subscription-plan">

                    <h3>Membership Plan</h3>

                    <p>£5 per year</p>

                </div>

                <div class="subscription-actions">

                    <button id="subscribeButton" class="btn-primary">
                        Subscribe with PayPal
                    </button>

                    <button id="manageButton" class="btn-secondary">
                        Manage Subscription
                    </button>

                </div>

            </div>

        </div>
    </section>

    <!-- Help Popup -->
    <div id="helpPopup" class="popupOverlay" style="display:none;">
        <div id="helpPopupWindow" class="popupWindow">
            <div id="helpContent"></div>
            <button id="closeHelpBtn" class="closeHelpBtn">Close</button>
        </div>
    </div>

    <script type="module" src="./scripts/subscription.js"></script>
