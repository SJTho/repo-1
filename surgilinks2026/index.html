<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surgical Hub</title>

    <link rel="stylesheet" href="./mcqcore.css">
</head>

<body>
    <h1>Surgical Hub</h1>

    <!-- Specialty Selector -->
    <div id="specialtySelect">
        <label for="specialty">Select Specialty:</label>
        <select id="specialty">
            <option value="Cardiothoracic Surgery">Cardiothoracic Surgery</option>
            <option value="Core Surgery">Core Surgery</option>
            <option value="General Surgery">General Surgery</option>
            <option value="Maxillofacial Surgery">Maxillofacial Surgery</option>
            <option value="Neurosurgery">Neurosurgery</option>
            <option value="Otolaryngology">Otolaryngology</option>
            <option value="Paediatric Surgery">Paediatric Surgery</option>
            <option value="Plastic Surgery">Plastic Surgery</option>
            <option value="Trauma and Orthopaedics">Trauma and Orthopaedics</option>
            <option value="Urology">Urology</option>
            <option value="Vascular Surgery">Vascular Surgery</option>
        </select>
    </div>

    <!-- Icon Grid -->
    <div id="linksContainer" class="iconGrid"></div>

    <!-- MCQ Button (separate) -->
    <div id="mcqContainer"></div>

    <!-- Delete Popup -->
    <div id="deletePopup" style="
        display:none;
        position:fixed;
        top:0; left:0;
        width:100%; height:100%;
        background:rgba(0,0,0,0.7);
        justify-content:center;
        align-items:center;
    ">
        <div style="
            background:#14233d;
            padding:20px;
            border-radius:10px;
            width:300px;
            text-align:center;
        ">
            <p style="margin-bottom:20px;">Delete this custom link?</p>
            <button id="confirmDelete" style="background:#8a2a2a; margin-bottom:10px;">Delete</button>
            <button id="cancelDelete">Cancel</button>
        </div>
    </div>

    <script>
        const specialtyLinks = {
            "Cardiothoracic Surgery": "https://scts.org",
            "Core Surgery": null,
            "General Surgery": "https://www.asgbi.org.uk/",
            "Maxillofacial Surgery": "https://www.baoms.org.uk",
            "Neurosurgery": "https://www.sbns.org.uk",
            "Otolaryngology": "https://www.entuk.org",
            "Paediatric Surgery": "https://www.baps.org.uk",
            "Plastic Surgery": "https://www.bapras.org.uk",
            "Trauma and Orthopaedics": "https://www.boa.ac.uk",
            "Urology": "https://www.baus.org.uk",
            "Vascular Surgery": "https://www.vascularsociety.org.uk"
        };

        const specialtyLabels = {
            "Maxillofacial Surgery": "Maxfax Surgery",
            "Trauma and Orthopaedics": "Trauma and Ortho",
            "Cardiothoracic Surgery": "Cardiac and Thoracic",
            "Neurosurgery": "Neuro",
            "Otolaryngology": "ENT"
        };

        const specialtySelect = document.getElementById("specialty");
        const linksContainer = document.getElementById("linksContainer");
        const mcqContainer = document.getElementById("mcqContainer");

        const deletePopup = document.getElementById("deletePopup");
        const confirmDelete = document.getElementById("confirmDelete");
        const cancelDelete = document.getElementById("cancelDelete");

        let deleteIndex = null;

        specialtySelect.value = localStorage.getItem("userSpecialty") || "Neurosurgery";

        specialtySelect.addEventListener("change", () => {
            localStorage.setItem("userSpecialty", specialtySelect.value);
            renderLinks();
        });

        function createIconCard(icon, label, url) {
            const card = document.createElement("div");
            card.className = "iconCard";

            // ensure iconCard can host top-right delete icon
            card.style.position = "relative";

            card.addEventListener("click", () => {
                window.open(url, "_blank");
            });

            card.innerHTML = `
                <div class="icon">${icon}</div>
                <p class="iconLabel">${label}</p>
            `;

            return card;
        }

        function createMCQCard() {
            const card = document.createElement("div");
            card.className = "mcqCard";

            card.addEventListener("click", () => {
                window.location.href = "mcqcore.html";
            });

            card.innerHTML = `
                <div class="icon">🧠</div>
                <p>MCQs</p>
            `;

            return card;
        }

        // -----------------------------
        // Custom Buttons (max 3)
        // -----------------------------
        function loadCustomButtons() {
            const saved = JSON.parse(localStorage.getItem("customButtons") || "[]");
            return saved.slice(0, 3);
        }

        function saveCustomButtons(buttons) {
            localStorage.setItem("customButtons", JSON.stringify(buttons));
        }


        function renderCustomButtons() {
            const buttons = loadCustomButtons();
            const fragment = document.createDocumentFragment();

            buttons.forEach((btn, index) => {
                const card = document.createElement("div");
                card.className = "iconCard";

                card.addEventListener("click", () => {
                    window.open(btn.url, "_blank");
                });

                // FIX: ensure icon always exists
                const iconHTML = btn.image
                    ? `<img src="${btn.image}" class="customIcon">`
                    : `<div class="icon smallIcon">🔗</div>`;   // placeholder icon

                card.innerHTML = `
            ${iconHTML}
            <p class="iconLabel">${btn.name}</p>
            <div class="customDeleteBtn">❌</div>
        `;

                card.querySelector(".customDeleteBtn").addEventListener("click", (event) => {
                    event.stopPropagation();
                    deleteIndex = index;
                    deletePopup.style.display = "flex";
                });

                fragment.appendChild(card);
            });

            return fragment;
        }

        // Delete confirmation
        confirmDelete.addEventListener("click", () => {
            const buttons = loadCustomButtons();
            buttons.splice(deleteIndex, 1);
            saveCustomButtons(buttons);
            deletePopup.style.display = "none";
            renderLinks();
        });

        cancelDelete.addEventListener("click", () => {
            deletePopup.style.display = "none";
        });

        // Add Link button (only if < 3 custom buttons)
        function createAddLinkButton() {
            const card = document.createElement("div");
            card.className = "iconCard";

            card.addEventListener("click", () => {
                window.location.href = "custom_button.html";
            });

            card.innerHTML = `
        <div class="icon smallIcon">🔗</div>
        <p class="iconLabel">Add Link</p>
    `;

            return card;
        }

        // -----------------------------
        // Render All Buttons
        // -----------------------------
        function renderLinks() {
            linksContainer.innerHTML = "";
            mcqContainer.innerHTML = "";

            const specialty = specialtySelect.value;

            // First four system buttons
            linksContainer.appendChild(createIconCard("📘", "ISCP", "https://www.iscp.ac.uk"));
            linksContainer.appendChild(createIconCard("📊", "eLogbook", "https://client.elogbook.org/"));
            linksContainer.appendChild(
                createIconCard("📝", "MRCS", "https://www.intercollegiatemrcsexams.org.uk/")
            );
            linksContainer.appendChild(createIconCard("🎓", "JCIE", "https://www.jcie.org.uk"));
            linksContainer.appendChild(createIconCard("🏛️", "JCST", "https://www.jcst.org"));

            // Specialty association (always 5th)
            const assocURL = specialtyLinks[specialty];
            if (assocURL) {
                const displayLabel = specialtyLabels[specialty] || specialty;
                linksContainer.appendChild(createIconCard("👥", displayLabel, assocURL));
            }

            // Custom buttons (6th, 7th, 8th)
            linksContainer.appendChild(renderCustomButtons());

            // Add Link button only if fewer than 3 custom buttons
            if (loadCustomButtons().length < 3) {
                linksContainer.appendChild(createAddLinkButton());
            }

            // MCQ button (separate)
            mcqContainer.appendChild(createMCQCard());
        }

        renderLinks();
    </script>

</body>
