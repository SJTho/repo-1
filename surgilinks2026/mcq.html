<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice MCQs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1526;
      color: #fff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
    }

    #mcqArea {
      margin-top: 40px;
      background: #14233d;
      padding: 20px;
      border-radius: 10px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }

    label {
      display: block;
      margin-top: 15px;
      font-size: 18px;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      font-size: 16px;
      border: none;
    }

    .questionBlock {
      background: #1f3b6f;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .questionBlock p {
      margin-bottom: 10px;
    }

    #scoreDisplay {
      margin-top: 30px;
      font-size: 22px;
      font-weight: bold;
      background: #1f3b6f;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #2a4c8a;
      color: #fff;
    }

    button:hover {
      background: #3b5ca3;
    }

    #closeBtn {
      background: #8a2a2a;
      margin-top: 40px;
      width: 100%;
    }

    #closeBtn:hover {
      background: #a33b3b;
    }

    .explanation {
      margin-top: 10px;
      font-size: 16px;
      background: #0e1d33;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <script>
    // This connects your page to Copilot inside the browser
    window.copilot = {
      generateMCQs: async ({count, topic, level}) => {
        // Ask Copilot to generate questions
        const response = await navigator.copilot.invoke("generateMCQs", {
          count,
          topic,
          level
        });

        return response.questions;
      }
    };
  </script>

  <h1>Practice MCQs</h1>

  <div id="mcqArea">
    <label for="mcqCount">How many questions?</label>
    <input type="number" id="mcqCount" min="1" placeholder="e.g., 20">

    <label for="mcqAreas">Which areas of surgery?</label>
    <input type="text" id="mcqAreas" placeholder="e.g., colorectal, neurotrauma, vascular emergencies">

    <label for="mcqLevel">Level:</label>
    <select id="mcqLevel">
      <option value="Finals">Finals</option>
      <option value="MRCS">MRCS</option>
      <option value="JCIE">JCIE</option>
    </select>

    <button onclick="generateMCQs()">Submit</button>

    <div id="mcqQuestions"></div>
    <div id="scoreDisplay"></div>

    <button id="closeBtn" onclick="window.location.href='index.html'">Close</button>
  </div>

  <script>
    // This function expects a Copilot integration that provides:
    // window.copilot.generateMCQs({ count, topic, level }) -> Promise<[ { stem, options[], correctIndex, explanation } ]>
    // You’ll wire that on the Copilot side; this file just consumes it.

    async function generateMCQs() {
      const count = parseInt(document.getElementById("mcqCount").value);
      const topic = document.getElementById("mcqAreas").value.trim();
      const level = document.getElementById("mcqLevel").value;

      if (!count || count < 1) {
        alert("Please enter a valid number of questions.");
        return;
      }

      if (!topic) {
        alert("Please specify an area of surgery.");
        return;
      }

      const container = document.getElementById("mcqQuestions");
      container.innerHTML = "";
      document.getElementById("scoreDisplay").innerHTML = "";

      if (!window.copilot || typeof window.copilot.generateMCQs !== "function") {
        alert("MCQ generation service is not available. Please connect this page to Copilot.");
        return;
      }

      let questions;
      try {
        questions = await window.copilot.generateMCQs({
          count,
          topic,
          level
        });
      } catch (e) {
        alert("There was a problem generating questions. Please try again.");
        return;
      }

      if (!Array.isArray(questions) || questions.length === 0) {
        alert("No questions were generated. Try a different topic or number.");
        return;
      }

      // Avoid duplicates by using only the first N questions returned
      const selectedQuestions = questions.slice(0, count);
      let score = 0;

      selectedQuestions.forEach((q, index) => {
        const i = index + 1;

        const block = document.createElement("div");
        block.className = "questionBlock";

        block.innerHTML = `
          <p><strong>Q${i} (${level}):</strong> ${q.stem}</p>
          ${q.options.map((opt, j) => `
            <label>
              <input type="radio" name="q${i}" value="${j}">
              ${opt}
            </label><br>
          `).join("")}
        `;

        block.dataset.correct = q.correctIndex;
        block.dataset.explanation = q.explanation || "No explanation provided.";

        container.appendChild(block);
      });

      const finishBtn = document.createElement("button");
      finishBtn.textContent = "Finish MCQs";
      finishBtn.onclick = () => {
        score = 0;

        selectedQuestions.forEach((q, index) => {
          const i = index + 1;
          const block = document.querySelector(`.questionBlock:nth-child(${i})`);
          const selected = document.querySelector(`input[name="q${i}"]:checked`);
          const correct = block.dataset.correct;
          const explanation = block.dataset.explanation;

          if (selected && selected.value === correct) {
            score++;
          }

          const explanationDiv = document.createElement("div");
          explanationDiv.className = "explanation";
          explanationDiv.innerHTML = `<strong>Explanation:</strong> ${explanation}`;
          block.appendChild(explanationDiv);
        });

        document.getElementById("scoreDisplay").innerHTML =
          `You scored ${score} out of ${selectedQuestions.length}`;
      };

      container.appendChild(finishBtn);
    }
  </script>
</body>

</html>
