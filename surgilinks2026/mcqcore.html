<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice MCQs</title>

  <link rel="stylesheet" href="./mcqcore.css">
</head>

<body>

  <!-- Top-left points + rank -->
  <div id="topLeftInfo">
    <div id="pointsValue" class="tinyText">
      🧑‍⚕️ <span id="pointsNumber"></span>
    </div>
    <div id="rankValue" class="tinyText"></div>
  </div>

  <!-- Top-right help button -->
  <div id="helpButton">❓</div>

  <h1>Practice MCQs</h1>

  <div id="mcqArea">
    <label for="mcqCount">How many questions?</label>
    <input type="number" id="mcqCount" min="1" value="20">

    <label for="mcqAreas">Which specialty?</label>
    <select id="mcqAreas">
      <option value="all">All</option>
      <option value="Cardiothoracic Surgery">Cardiothoracic Surgery</option>
      <option value="Core Surgery">Core Surgery</option>
      <option value="General Surgery">General Surgery</option>
      <option value="Maxillofacial Surgery">Maxillofacial Surgery</option>
      <option value="Neurosurgery">Neurosurgery</option>
      <option value="Otolaryngology">Otolaryngology</option>
      <option value="Paediatric Surgery">Paediatric Surgery</option>
      <option value="Plastic Surgery">Plastic Surgery</option>
      <option value="Trauma and Orthopaedics">Trauma and Orthopaedics</option>
      <option value="Urology">Urology</option>
      <option value="Vascular Surgery">Vascular Surgery</option>
    </select>

    <label for="mcqLevel">Level</label>
    <select id="mcqLevel">
      <option value="all">All</option>
      <option value="MBBS">MBBS</option>
      <option value="MRCS">MRCS</option>
      <option value="FRCS">FRCS</option>
    </select>

    <button id="startSubmitBtn" onclick="generateMCQs()">Submit</button>

    <div id="mcqQuestions"></div>
    <div id="scoreDisplay"></div>

    <button id="closeBtn" onclick="window.location.href='index.html'">Close</button>
  </div>

  <!-- Load question bank -->
  <script src="./mcqData.js"></script>

  <script>

    /* -----------------------------------------
       HELP BUTTON
    ----------------------------------------- */
    document.getElementById("helpButton").addEventListener("click", () => {
      window.location.href = "help.html";
    });

    /* -----------------------------------------
       DAILY REWARD (+10 per day)
    ----------------------------------------- */
    function giveDailyReward() {
      const today = new Date().toISOString().split("T")[0];
      const last = localStorage.getItem("lastDailyReward");

      if (last !== today) {
        let pts = parseInt(localStorage.getItem("scalpelPoints")) || 0;
        pts += 10;
        localStorage.setItem("scalpelPoints", String(pts));
        localStorage.setItem("lastDailyReward", today);

        alert("Daily reward: +10 points!");
      }
    }
    giveDailyReward();

    /* -----------------------------------------
       POINTS + RANK DISPLAY
    ----------------------------------------- */
    function getScalpelPoints() {
      return parseInt(localStorage.getItem("scalpelPoints")) || 0;
    }

    function setScalpelPoints(amount) {
      localStorage.setItem("scalpelPoints", String(amount));
    }

    function getRank(points) {
      if (points <= 300) return "Observer";
      if (points <= 600) return "Assistant";
      if (points <= 900) return "Supervised Scrubbed";
      if (points <= 1200) return "Supervised Unscrubbed";
      return "Independent Practice";
    }

    function rankIndex(rank) {
      const ranks = [
        "Observer",
        "Assistant",
        "Supervised Scrubbed",
        "Supervised Unscrubbed",
        "Independent Practice"
      ];
      return ranks.indexOf(rank);
    }

    let previousRank = localStorage.getItem("previousRank") || null;

    function updatePointsDisplay() {
      const pts = getScalpelPoints();
      const newRank = getRank(pts);

      document.getElementById("pointsNumber").textContent = pts;
      document.getElementById("rankValue").textContent = newRank;

      previousRank = newRank;
      localStorage.setItem("previousRank", newRank);
    }

    updatePointsDisplay();
    window.addEventListener("focus", updatePointsDisplay);

    /* -----------------------------------------
       AUTO-SELECT SPECIALTY
    ----------------------------------------- */
    const savedSpecialty = localStorage.getItem("userSpecialty");
    if (savedSpecialty) {
      document.getElementById("mcqAreas").value = savedSpecialty;
    }

    /* -----------------------------------------
       SELECT OPTION
    ----------------------------------------- */
    function selectOption(qIndex, optIndex, element) {
      const allOptions = document.querySelectorAll(`label.optionLabel[data-q="${qIndex}"]`);
      allOptions.forEach(opt => opt.classList.remove("selected"));
      element.classList.add("selected");

      const radio = element.querySelector("input[type='radio']");
      radio.checked = true;
    }

    /* -----------------------------------------
       STORE SCORE
    ----------------------------------------- */
    function storeScore(score, total, topic, level) {
      const now = new Date();
      const timestamp =
        now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0") + " " +
        String(now.getHours()).padStart(2, "0") + ":" +
        String(now.getMinutes()).padStart(2, "0");

      const entry = { score, total, topic, level, timestamp };

      let stored = localStorage.getItem("scores");
      let scores = stored ? JSON.parse(stored) : [];

      scores.push(entry);

      localStorage.setItem("scores", JSON.stringify(scores));
    }

    /* -----------------------------------------
       MCQ GENERATOR (FILTER + SHUFFLE)
    ----------------------------------------- */
    window.copilot = {
      generateMCQs: async ({ count, topic, level }) => {
        let filtered = demoPool;

        if (topic !== "all") {
          filtered = filtered.filter(q => q.topic.toLowerCase().includes(topic.toLowerCase()));
        }

        if (level !== "all") {
          filtered = filtered.filter(q => q.level.toLowerCase().includes(level.toLowerCase()));
        }

        for (let i = filtered.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
        }

        return filtered.slice(0, count);
      }
    };

    /* -----------------------------------------
       FLAG QUESTION (hide button after click)
    ----------------------------------------- */
    function flagQuestion(qIndex, buttonElement) {
      const q = demoPool[qIndex];
      if (!q) return;

      q.flaggedSet = (q.flaggedSet || 0) + 1;

      alert(`Question flagged (${q.flaggedSet}/5)`);

      // Hide button so user cannot flag twice
      buttonElement.style.display = "none";

      if (q.flaggedSet >= 5) {
        demoPool.splice(qIndex, 1);
        alert("This question has been removed due to repeated flags.");
      }
    }

    /* -----------------------------------------
       GENERATE MCQs
    ----------------------------------------- */
    async function generateMCQs() {
      const count = parseInt(document.getElementById("mcqCount").value);
      const topic = document.getElementById("mcqAreas").value;
      const level = document.getElementById("mcqLevel").value;

      if (!count || count < 1) {
        alert("Please enter a valid number of questions.");
        return;
      }

      const container = document.getElementById("mcqQuestions");
      container.innerHTML = "";
      document.getElementById("scoreDisplay").innerHTML = "";

      // Hide controls
      document.getElementById("mcqCount").style.display = "none";
      document.getElementById("mcqAreas").style.display = "none";
      document.getElementById("mcqLevel").style.display = "none";
      document.getElementById("startSubmitBtn").style.display = "none";
      document.querySelector("label[for='mcqCount']").style.display = "none";
      document.querySelector("label[for='mcqAreas']").style.display = "none";
      document.querySelector("label[for='mcqLevel']").style.display = "none";

      let questions = await window.copilot.generateMCQs({ count, topic, level });

      if (!questions || questions.length === 0) {
        alert("No questions available for that topic/level.");
        return;
      }

      questions.forEach((q, index) => {
        const block = document.createElement("div");
        block.className = "questionBlock";

        block.innerHTML = `
          <p><strong>Q${index + 1} (${q.level}):</strong> ${q.stem}</p>
          ${q.options.map((opt, j) => `
            <label class="optionLabel" data-q="${index}" onclick="selectOption(${index}, ${j}, this)">
              <input type="radio" name="q${index}" value="${j}">
              ${opt}
            </label>
          `).join("")}
        `;

        block.dataset.correct = q.correctIndex;
        block.dataset.explanation = q.explanation;

        container.appendChild(block);
      });

      const submitBtn = document.createElement("button");
      submitBtn.textContent = "Submit";

      submitBtn.onclick = () => {
        submitBtn.remove();
        scoresBtn.style.display = "inline-block";

        let score = 0;
        let scalpelDelta = 0;

        const blocks = document.querySelectorAll(".questionBlock");

        blocks.forEach((block, index) => {
          const selected = document.querySelector(`input[name="q${index}"]:checked`);
          const correct = block.dataset.correct;
          const explanation = block.dataset.explanation;

          const isCorrect = selected && selected.value === correct;

          if (isCorrect) {
            score++;
            scalpelDelta += 2;

            block.style.border = "2px solid #4CAF50";
            block.insertAdjacentHTML("beforeend",
              `<p class="resultTag" style="color:#4CAF50;"><strong>Correct (+2)</strong></p>`
            );

          } else {
            scalpelDelta -= 1;

            block.style.border = "2px solid #b30000";
            block.insertAdjacentHTML("beforeend",
              `<p class="resultTag" style="color:#b30000;"><strong>Wrong (-1)</strong></p>`
            );
          }

          if (!block.querySelector(".explanation")) {
            const explanationDiv = document.createElement("div");
            explanationDiv.className = "explanation";
            explanationDiv.innerHTML = `<strong>Explanation:</strong> ${explanation}`;
            block.appendChild(explanationDiv);
          }

          /* Add flag button (only after submission) */
          const flagBtn = document.createElement("button");
          flagBtn.textContent = "Flag Question";
          flagBtn.className = "flagBtn";
          flagBtn.onclick = () => flagQuestion(index, flagBtn);
          block.appendChild(flagBtn);
        });

        document.getElementById("scoreDisplay").innerHTML = "";

        let currentPoints = parseInt(localStorage.getItem("scalpelPoints")) || 0;
        let newPoints = currentPoints + scalpelDelta;
        localStorage.setItem("scalpelPoints", String(newPoints));

        updatePointsDisplay();

        storeScore(score, questions.length, topic, level);
      };

      container.appendChild(submitBtn);

      const scoresBtn = document.createElement("button");
      scoresBtn.textContent = "Progress";
      scoresBtn.style.display = "none";
      scoresBtn.onclick = () => window.location.href = "scores.html";

      container.appendChild(scoresBtn);
    }
  </script>

</body>

</html>
