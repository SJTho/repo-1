<!DOCTYPE html>
<html>

<head>
    <title>Unsubscribe</title>
</head>

<body>

    <h1>Unsubscribe</h1>

    <p id="message"></p>

    <button id="unsubscribeBtn">
        Confirm Unsubscribe
    </button>

    <script>
        const params = new URLSearchParams(window.location.search);
        const email = params.get("email");

        document.getElementById("message").textContent =
            `Are you sure you wish to unsubscribe ${email}?`;

        document.getElementById("unsubscribeBtn").onclick = async () => {

            const response = await fetch(
                "https://YOUR_PROJECT_REF.supabase.co/functions/v1/unsubscribe",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({email})
                }
            );

            if (response.ok) {
                document.body.innerHTML =
                    "<h1>Successfully unsubscribed</h1>";
            } else {
                alert("Unable to unsubscribe");
            }
        };
    </script>

</body>

</html>
