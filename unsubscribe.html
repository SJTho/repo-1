<!DOCTYPE html>
<html>

<head>
    <title>Unsubscribe</title>
</head>

<body>

    <h1>Unsubscribe</h1>

    <a class="logo" href="index.html">
        <img src="favicon.ico" alt="NeuroReg.app logo">
        <span>NeuroReg.net</span>
    </a>

    <p id=" message"></p>

    <button id="unsubscribeBtn">
        Confirm Unsubscribe
    </button>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        document.getElementById("message").textContent =
            "Are you sure you wish to unsubscribe from Email A Question?";

        document.getElementById("unsubscribeBtn").onclick = async () => {

            const response = await fetch(
                "https://jzdvtqkssamxndgrttct.supabase.co/functions/v1/unsubscribe",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({token})
                }
            );

            if (response.ok) {
                document.body.innerHTML =
                    "<h1>Successfully unsubscribed</h1><p>You will no longer receive Email A Question emails.</p>";
            } else {

                const error = await response.text();
                console.log(error);

                alert("Unable to unsubscribe");
            }
        };
    </script>

</body>

</html>
