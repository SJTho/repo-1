<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta-name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>

    <link rel="stylesheet" href="mcqcore.css">

    <style>
      .closedMsg {
        color: red;
        font-weight: bold;
      }
    </style>

    <script type="module">
      import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
      import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

      const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

      /* ----------------------------------------------------
         LOGIN REDIRECT
      ---------------------------------------------------- */
      const sessionToken = localStorage.getItem("sessionToken");
      if (!sessionToken) {
        window.location.href = "login.html";
      }

      const userId = parseInt(localStorage.getItem("userId"));

      /* ----------------------------------------------------
         TIME FORMATTER (HH:MM)
      ---------------------------------------------------- */
      function formatTime(timeString) {
        return timeString.slice(0, 5); // "09:00"
      }

      /* ----------------------------------------------------
         CHECK REGISTRATION (Supabase)
      ---------------------------------------------------- */
      async function isRegistered(ev) {
        if (!userId) return false;

        const {data, error} = await supabase
          .from("eventregistration")
          .select("*")
          .eq("userid", userId)
          .eq("eventid", ev.eventid);

        if (error) {
          console.error(error);
          return false;
        }

        return data && data.length > 0;
      }

      /* ----------------------------------------------------
         REGISTER FOR EVENT (Supabase)
      ---------------------------------------------------- */
      async function registerForEvent(ev) {
        if (!userId) {
          alert("You must be logged in to register.");
          return;
        }

        const {data: existing, error: checkError} = await supabase
          .from("eventregistration")
          .select("*")
          .eq("userid", userId)
          .eq("eventid", ev.eventid);

        if (checkError) {
          console.error(checkError);
          alert("Failed to check registration.");
          return;
        }

        if (existing && existing.length > 0) {
          alert("You are already registered for this event.");
          return;
        }

        const {error: insertError} = await supabase
          .from("eventregistration")
          .insert({
            userid: userId,
            eventid: ev.eventid
          });

        if (insertError) {
          console.error(insertError);
          alert("Failed to register for event.");
          return;
        }

        // 🔥 No confirmation box — just refresh
        location.reload();
      }

      /* ----------------------------------------------------
         LIVE CHECK
      ---------------------------------------------------- */
      function isEventLive(ev) {
        const now = new Date();
        const start = new Date(ev.eventdate + "T" + formatTime(ev.eventstarttime));
        const end = new Date(ev.eventdate + "T" + formatTime(ev.eventendtime));
        return now >= start && now <= end;
      }

      /* ----------------------------------------------------
         LOAD EVENTS FROM SUPABASE
      ---------------------------------------------------- */
      async function loadEvents() {
        const container = document.getElementById("eventsContainer");

        const {data: events, error} = await supabase
          .from("events")
          .select("eventid, eventtitle, eventdate, eventstarttime, eventendtime")
          .order("eventdate", {ascending: true});

        if (error) {
          console.error(error);
          container.innerHTML = "<p>Failed to load events.</p>";
          return;
        }

        if (!events || events.length === 0) {
          container.innerHTML = "<p>No upcoming events.</p>";
          return;
        }

        for (const ev of events) {
          const ukDate = new Date(ev.eventdate).toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          });

          const already = await isRegistered(ev);
          const live = isEventLive(ev);

          const now = new Date();
          const eventEnd = new Date(ev.eventdate + "T" + formatTime(ev.eventendtime));
          const closed = now > eventEnd;

          const card = document.createElement("div");
          card.className = "eventCard";

          card.innerHTML = `
                    <h3>${ev.eventtitle}</h3>
                    <p><strong>Date:</strong> ${ukDate}</p>
                    <p><strong>Start time:</strong> Available between ${formatTime(ev.eventstarttime)} and ${formatTime(ev.eventendtime)}</p>

                    ${closed
              ? `<p class="closedMsg">Closed</p>`
              : already
                ? (live
                  ? `<button class="registerBtn startBtn">Start</button>`
                  : `<p class="alreadyRegisteredMsg">You have already registered</p>`
                )
                : `<button class="registerBtn">Register</button>`
            }
                `;

          if (!closed && !already) {
            card.querySelector(".registerBtn").addEventListener("click", async () => {
              await registerForEvent(ev);
            });
          }

          if (!closed && already && live) {
            card.querySelector(".startBtn").addEventListener("click", () => {

              // ⭐ Store event details for formaltestinstructions.html
              localStorage.setItem("currentEventId", ev.eventid);
              localStorage.setItem("currentEventTitle", ev.eventtitle);
              localStorage.setItem("currentEventStart", formatTime(ev.eventstarttime));
              localStorage.setItem("currentEventFinish", formatTime(ev.eventendtime));

              window.location.href = "formaltestinstructions.html";
            });
          }

          container.appendChild(card);
        }
      }

      window.addEventListener("DOMContentLoaded", loadEvents);
    </script>
</head>

<body>

  <!-- Top-left hamburger -->
  <div id="hamburgerMenu" class="hamburgerIcon">☰</div>

  <!-- Dropdown Menu -->
  <div id="hamburgerMenuDropdown" class="dropdownMenu">
    <div class="dropdownItem" onclick="window.location.href='mcqcore.html'">🧠 Test yourself</div>

    <div class="dropdownSeparator"></div>

    <div class="dropdownItem" onclick="window.location.href='index.html'">🏠 Home</div>
    <div class="dropdownItem" onclick="window.location.href='profile.html'">🧑‍⚕️ Profile</div>
    <div class="dropdownItem" onclick="window.location.href='rank.html'">🏅 Rank</div>

    <div class="dropdownSeparator"></div>

    <div class="dropdownItem" onclick="window.location.href='login.html'">🚪 Logout</div>
  </div>

  <!-- Top-right icons -->
  <div id="topRightIcons">
    <div id="rankIcon" class="topRightIcon" onclick="window.location.href='rank.html'">🏅</div>
    <div id="homeIcon" class="topRightIcon" onclick="window.location.href='index.html'">🏠</div>
    <div id="profileIcon" class="topRightIcon" onclick="window.location.href='profile.html'">🧑‍⚕️</div>
    <div id="helpButton" class="topRightIcon" onclick="window.location.href='help.html'">❔</div>
  </div>

  <script>
    /* Dropdown toggle */
    const hamburger = document.getElementById("hamburgerMenu");
    const dropdown = document.getElementById("hamburgerMenuDropdown");

    hamburger.addEventListener("click", () => {
      dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", (event) => {
      if (!hamburger.contains(event.target) && !dropdown.contains(event.target)) {
        dropdown.style.display = "none";
      }
    });
  </script>

  <h1>Events</h1>

  <div id="eventsContainer"></div>

</body>

</html>
