<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Flagged Questions</title>

  <link rel="stylesheet" href="./mcqcore.css">

  <style>
    #flaggedContainer {
      margin-top: 20px;
    }

    .flaggedItem {
      border: 1px solid #ccc;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      background: #f9f9f9;
    }

    .flaggedItem textarea {
      width: 100%;
      height: 80px;
      margin-bottom: 10px;
    }

    .flaggedItem input,
    .flaggedItem select {
      width: 100%;
      margin-bottom: 8px;
    }

    .flaggedItem button {
      margin-top: 10px;
      margin-right: 10px;
    }

    #closeBtn {
      margin-top: 40px;
      width: 100%;
      padding: 12px;
      font-size: 18px;
    }
  </style>

  <script type="module">
    import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://jzdvtqkssamxndgrttct.supabase.co";
    window.supabaseKeyy = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6ZHZ0cWtzc2FteG5kZ3J0dGN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNDQ1NzAsImV4cCI6MjEwMTkyMDU3MH0.CHKV56rf8ZSwwKIN0fuzEBuPoxn8qwSW0YzW_1DFcgM";
    window.supabase = createClient(supabaseUrl, window.supabaseKeyy);

    window.fetchFlaggedQuestions = async () => {
      const {data, error} = await window.supabase
        .from("mcqquestions")
        .select("*")
        .gte("flaggedset", 5);

      if (error) {
        console.error("Supabase fetch error:", error);
        alert("Error loading flagged questions. Check console.");
        return [];
      }

      return data;
    };
  </script>
</head>

<body>

  <div id="topLeftInfo">
    <div id="pointsValue" class="tinyText">
      🧑‍⚕️ <span id="pointsNumber"></span>
    </div>
    <div id="rankValue" class="tinyText"></div>
  </div>

  <div id="helpButton">❓</div>

  <h1>Flagged Questions</h1>

  <div id="flaggedContainer"></div>

  <button id="closeBtn" onclick="window.location.href='index.html'">Close</button>

  <script>
    window.addEventListener("DOMContentLoaded", () => {

      document.getElementById("helpButton").addEventListener("click", () => {
        window.location.href = "help.html";
      });

      function giveDailyReward() {
        const today = new Date().toISOString().split("T")[0];
        const last = localStorage.getItem("lastDailyReward");
        if (last !== today) {
          let pts = parseInt(localStorage.getItem("scalpelPoints")) || 0;
          pts += 10;
          localStorage.setItem("scalpelPoints", String(pts));
          localStorage.setItem("lastDailyReward", today);
          alert("Daily reward: +10 points!");
        }
      }
      giveDailyReward();

      function getScalpelPoints() {
        return parseInt(localStorage.getItem("scalpelPoints")) || 0;
      }

      function getRank(points) {
        if (points <= 300) return "Observer";
        if (points <= 600) return "Assistant";
        if (points <= 900) return "Supervised Scrubbed";
        if (points <= 1200) return "Supervised Unscrubbed";
        return "Independent Practice";
      }

      function updatePointsDisplay() {
        const pts = getScalpelPoints();
        const newRank = getRank(pts);
        document.getElementById("pointsNumber").textContent = pts;
        document.getElementById("rankValue").textContent = newRank;
        localStorage.setItem("previousRank", newRank);
      }

      updatePointsDisplay();
      window.addEventListener("focus", updatePointsDisplay);

      async function loadFlaggedQuestions() {
        const flagged = await window.fetchFlaggedQuestions();
        const container = document.getElementById("flaggedContainer");

        if (!flagged.length) {
          container.innerHTML = "<p>No flagged questions.</p>";
          return;
        }

        container.innerHTML = "";

        flagged.forEach(q => {
          const div = document.createElement("div");
          div.className = "flaggedItem";

          div.innerHTML = `
            <h3>Question ID: ${q.id}</h3>

            <label>Stem:</label>
            <textarea class="editStem" required>${q.stem || ""}</textarea>

            <label>Topic:</label>
            <select class="editTopic" required>
              <option value="">Select topic</option>
              <option value="Vascular" ${q.topic === "Vascular" ? "selected" : ""}>Vascular</option>
              <option value="Oncology" ${q.topic === "Oncology" ? "selected" : ""}>Oncology</option>
              <option value="Skull Base" ${q.topic === "Skull Base" ? "selected" : ""}>Skull base</option>
              <option value="Trauma" ${q.topic === "Trauma" ? "selected" : ""}>Trauma</option>
              <option value="CSF" ${q.topic === "CSF" ? "selected" : ""}>CSF</option>
              <option value="Spine" ${q.topic === "Spine" ? "selected" : ""}>Spine</option>
              <option value="Paediatrics" ${q.topic === "Paediatrics" ? "selected" : ""}>Paediatrics</option>
              <option value="Peripheral Nerve" ${q.topic === "Peripheral Nerve" ? "selected" : ""}>Peripheral Nerve</option>
              <option value="Functional" ${q.topic === "Functional" ? "selected" : ""}>Functional & Pain</option>
              <option value="Epilepsy" ${q.topic === "Epilepsy" ? "selected" : ""}>Epilepsy</option>
            </select>

            <label>Level:</label>
            <select class="editLevel" required>
              <option value="">Select level</option>
              <option value="MRCS" ${q.level === "MRCS" ? "selected" : ""}>MRCS</option>
              <option value="FRCS" ${q.level === "FRCS" ? "selected" : ""}>FRCS</option>
            </select>

            <label>Explanation:</label>
            <textarea class="editExplanation" required>${q.explanation || ""}</textarea>

            <label>Option 1:</label>
            <input class="editOption1" required value="${q.option1 || ""}">

            <label>Option 2:</label>
            <input class="editOption2" required value="${q.option2 || ""}">

            <label>Option 3:</label>
            <input class="editOption3" required value="${q.option3 || ""}">

            <label>Option 4:</label>
            <input class="editOption4" required value="${q.option4 || ""}">

            <button class="saveBtn">Save Changes</button>
          `;

          div.querySelector(".saveBtn").addEventListener("click", async () => {

            const stem = div.querySelector(".editStem").value.trim();
            const topic = div.querySelector(".editTopic").value.trim();
            const level = div.querySelector(".editLevel").value.trim();
            const explanation = div.querySelector(".editExplanation").value.trim();
            const option1 = div.querySelector(".editOption1").value.trim();
            const option2 = div.querySelector(".editOption2").value.trim();
            const option3 = div.querySelector(".editOption3").value.trim();
            const option4 = div.querySelector(".editOption4").value.trim();

            if (!stem || !topic || !level || !explanation || !option1 || !option2 || !option3 || !option4) {
              alert("All fields are mandatory.");
              return;
            }

            const updated = {
              stem,
              topic,
              level,
              explanation,
              option1,
              option2,
              option3,
              option4,
              flaggedset: 0
            };

            const {error} = await window.supabase
              .from("mcqquestions")
              .update(updated)
              .eq("id", q.id);

            if (error) {
              alert("Error saving changes.");
              console.error(error);
            } else {
              alert("Saved. flaggedset reset to 0.");
              loadFlaggedQuestions();
            }
          });

          container.appendChild(div);
        });
      }

      loadFlaggedQuestions();
    });
  </script>

</body>

</html>
