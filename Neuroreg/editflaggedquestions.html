<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Flagged Questions</title>

  <link rel="stylesheet" href="./mcqcore.css">
  <link rel="stylesheet" href="./editflaggedquestions.css">

  <script type="module">
    import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
    import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

    window.supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    window.fetchFlaggedQuestions = async () => {
      const {data, error} = await window.supabase
        .from("mcqquestions")
        .select("*")
        .gte("flaggedset", 5);

      if (error) {
        console.error("Supabase fetch error:", error);
        alert("Error loading flagged questions. Check console.");
        return [];
      }

      return data;
    };
  </script>
</head>

<body>

  <!-- Hamburger -->
  <div id="hamburgerMenu" class="hamburgerIcon">☰</div>
  <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>

  <!-- Top-right icons -->
  <div id="topRightIcons"></div>

  <!-- Dynamic Menu Loader -->
  <script type="module">
    import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
    import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";
    import {logout} from "./scripts/logout.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    window.logout = logout;

    async function loadHamburgerMenu() {
      const dropdown = document.getElementById("hamburgerMenuDropdown");
      const isAdmin = localStorage.getItem("isAdmin") === "true";
      const currentPage = window.location.pathname.split("/").pop();

      const {data, error} = await supabase
        .from("menuitems")
        .select("*")
        .eq("hamburger", true)
        .order("hamburgersection", {ascending: true})
        .order("hamburgerorder", {ascending: true});

      if (error) {
        console.error("Menu load error:", error);
        dropdown.innerHTML = "<div class='dropdownItem'>Menu failed to load</div>";
        return;
      }

      let currentSection = null;

      data.forEach(item => {
        if (item.admin && !isAdmin) return;
        if (item.url === currentPage) return;

        if (currentSection !== null && item.hamburgersection !== currentSection) {
          const separator = document.createElement("div");
          separator.className = "dropdownSeparator";
          dropdown.appendChild(separator);
        }

        currentSection = item.hamburgersection;

        const div = document.createElement("div");
        div.className = "dropdownItem";
        div.innerText = (item.emoji ? item.emoji + " " : "") + item.displayname;

        div.onclick = () => {
          if (item.url === "logout") logout();
          else window.location.href = item.url;
        };

        dropdown.appendChild(div);
      });
    }

    window.addEventListener("DOMContentLoaded", loadHamburgerMenu);

    async function loadTopRightIcons() {
      const container = document.getElementById("topRightIcons");
      const isAdmin = localStorage.getItem("isAdmin") === "true";
      const currentPage = window.location.pathname.split("/").pop();

      const {data, error} = await supabase
        .from("menuitems")
        .select("*")
        .eq("topright", true)
        .order("toprightorder", {ascending: true});

      if (error) {
        console.error("Top-right load error:", error);
        return;
      }

      container.innerHTML = "";

      data.forEach(item => {
        if (item.admin && !isAdmin) return;
        if (item.url === currentPage) return;

        const icon = document.createElement("div");
        icon.className = "topRightIcon";
        icon.innerText = item.emoji;

        icon.onclick = () => {
          if (item.url === "logout") logout();
          else window.location.href = item.url;
        };

        container.appendChild(icon);
      });
    }

    window.addEventListener("DOMContentLoaded", loadTopRightIcons);
  </script>

  <!-- Hamburger toggle -->
  <script>
    const hamburger = document.getElementById("hamburgerMenu");
    const dropdown = document.getElementById("hamburgerMenuDropdown");

    hamburger.addEventListener("click", () => {
      dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", (event) => {
      if (!hamburger.contains(event.target) && !dropdown.contains(event.target)) {
        dropdown.style.display = "none";
      }
    });
  </script>

  <h1>Flagged Questions</h1>

  <div id="flaggedContainer"></div>

  <button id="closeBtn" onclick="window.location.href='index.html'">Close</button>

  <script>
    window.addEventListener("DOMContentLoaded", () => {

      async function loadFlaggedQuestions() {
        const flagged = await window.fetchFlaggedQuestions();
        const container = document.getElementById("flaggedContainer");

        if (!flagged.length) {
          container.innerHTML = "<p>No flagged questions.</p>";
          return;
        }

        container.innerHTML = "";

        flagged.forEach(q => {
          const div = document.createElement("div");
          div.className = "flaggedItem";

          div.innerHTML = `
            <div class="stemRow">
              <label for="stem_${q.id}">Stem:</label>
              <input id="stem_${q.id}" class="editStem" required value="${q.stem || ""}">
            </div>

            <div class="collapsibleContent">

              <div class="topicLevelRow">
                <label for="topic_${q.id}">Topic:</label>
                <select id="topic_${q.id}" class="editTopic" required>
                  <option value="">Select topic</option>
                  <option value="Vascular" ${q.topic === "Vascular" ? "selected" : ""}>Vascular</option>
                  <option value="Oncology" ${q.topic === "Oncology" ? "selected" : ""}>Oncology</option>
                  <option value="Skull Base" ${q.topic === "Skull Base" ? "selected" : ""}>Skull base</option>
                  <option value="Trauma" ${q.topic === "Trauma" ? "selected" : ""}>Trauma</option>
                  <option value="CSF" ${q.topic === "CSF" ? "selected" : ""}>CSF</option>
                  <option value="Spine" ${q.topic === "Spine" ? "selected" : ""}>Spine</option>
                  <option value="Paediatrics" ${q.topic === "Paediatrics" ? "selected" : ""}>Paediatrics</option>
                  <option value="Peripheral Nerve" ${q.topic === "Peripheral Nerve" ? "selected" : ""}>Peripheral Nerve</option>
                  <option value="Functional" ${q.topic === "Functional" ? "selected" : ""}>Functional & Pain</option>
                  <option value="Epilepsy" ${q.topic === "Epilepsy" ? "selected" : ""}>Epilepsy</option>
                </select>

                <label for="level_${q.id}">Level:</label>
                <select id="level_${q.id}" class="editLevel" required>
                  <option value="">Select level</option>
                  <option value="MRCS" ${q.level === "MRCS" ? "selected" : ""}>MRCS</option>
                  <option value="FRCS" ${q.level === "FRCS" ? "selected" : ""}>FRCS</option>
                </select>
              </div>

              <div class="explanationRow">
                <label for="explanation_${q.id}">Explanation:</label>
                <input id="explanation_${q.id}" class="editExplanation" required value="${q.explanation || ""}">
              </div>

              <div class="optionRow12">
                <label for="option1_${q.id}">Correct:</label>
                <input id="option1_${q.id}" class="editOption1" required value="${q.option1 || ""}">

                <label for="option2_${q.id}">Incorrect:</label>
                <input id="option2_${q.id}" class="editOption2" required value="${q.option2 || ""}">
              </div>

              <div class="optionRow34">
                <label for="option3_${q.id}">Incorrect:</label>
                <input id="option3_${q.id}" class="editOption3" required value="${q.option3 || ""}">

                <label for="option4_${q.id}">Incorrect:</label>
                <input id="option4_${q.id}" class="editOption4" required value="${q.option4 || ""}">
              </div>

              <button class="saveBtn">Save Changes</button>

            </div>
          `;

          const content = div.querySelector(".collapsibleContent");
          content.style.display = "none";

          div.addEventListener("click", (e) => {
            if (["INPUT", "TEXTAREA", "SELECT", "BUTTON"].includes(e.target.tagName)) return;
            const isOpen = content.style.display === "block";
            content.style.display = isOpen ? "none" : "block";
          });

          div.querySelector(".saveBtn").addEventListener("click", async () => {

            const stem = div.querySelector(".editStem").value.trim();
            const topic = div.querySelector(".editTopic").value.trim();
            const level = div.querySelector(".editLevel").value.trim();
            const explanation = div.querySelector(".editExplanation").value.trim();
            const option1 = div.querySelector(".editOption1").value.trim();
            const option2 = div.querySelector(".editOption2").value.trim();
            const option3 = div.querySelector(".editOption3").value.trim();
            const option4 = div.querySelector(".editOption4").value.trim();

            if (!stem || !topic || !level || !explanation || !option1 || !option2 || !option3 || !option4) {
              alert("All fields are mandatory.");
              return;
            }

            const updated = {
              stem,
              topic,
              level,
              explanation,
              option1,
              option2,
              option3,
              option4,
              flaggedset: 0
            };

            const {error} = await window.supabase
              .from("mcqquestions")
              .update(updated)
              .eq("id", q.id);

            if (error) {
              alert("Error saving changes.");
              console.error(error);
            } else {
              alert("Saved. flaggedset reset to 0.");
              loadFlaggedQuestions();
            }
          });

          container.appendChild(div);
        });
      }

      loadFlaggedQuestions();
    });
  </script>

</body>

</html>
