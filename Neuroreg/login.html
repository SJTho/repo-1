<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login / Signup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        #authContainer {
            max-width: 400px;
            margin: auto;
        }

        .authRow {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        .switchLink {
            margin-top: 12px;
            color: blue;
            cursor: pointer;
            text-align: center;
        }

        .errorBox {
            display: none;
            color: red;
            margin-top: 10px;
            font-weight: 600;
        }
    </style>

    <script type="module" src="js/login.js"></script>
</head>

<body>

    <div id="authContainer">

        <!-- LOGIN FORM -->
        <div id="loginForm">
            <h2>Login</h2>

            <div class="authRow">
                <label>Email</label>
                <input id="loginEmail" type="email">
            </div>

            <div class="authRow">
                <label>Password</label>
                <input id="loginPassword" type="password">
            </div>

            <button onclick="handleLogin()">Login</button>

            <div class="switchLink" onclick="showSignup()">Create an account</div>
            <div id="login-error" class="errorBox"></div>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signupForm" style="display:none;">
            <h2>Sign Up</h2>

            <div class="authRow">
                <label>Email</label>
                <input id="signupEmail" type="email">
            </div>

            <div class="authRow">
                <label>Password</label>
                <input id="signupPassword" type="password">
            </div>

            <div class="authRow">
                <label>Nickname</label>
                <input id="signupNickname" type="text">
            </div>

            <button onclick="handleSignup()">Sign Up</button>

            <div class="switchLink" onclick="showLogin()">Already have an account?</div>
            <div id="signup-error" class="errorBox"></div>
        </div>

    </div>

    <script>
        // Toggle functions
        function showLogin() {
            document.getElementById("loginForm").style.display = "block";
            document.getElementById("signupForm").style.display = "none";
        }

        function showSignup() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("signupForm").style.display = "block";
        }

        // Login handler
        async function handleLogin() {
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value.trim();
            const errorBox = document.getElementById("login-error");

            const result = await login(email, password);

            if (result.error) {
                errorBox.textContent = result.error;
                errorBox.style.display = "block";
                return;
            }
        }

        // Signup handler
        async function handleSignup() {
            const email = document.getElementById("signupEmail").value.trim();
            const password = document.getElementById("signupPassword").value.trim();
            const nickname = document.getElementById("signupNickname").value.trim();
            const errorBox = document.getElementById("signup-error");

            const result = await signup(email, password, nickname);

            if (result.error) {
                errorBox.textContent = result.error;
                errorBox.style.display = "block";
                return;
            }
        }
    </script>

</body>

</html>
