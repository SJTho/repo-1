<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login / Signup</title>

    <link rel="stylesheet" href="css/login.css">
    <script type="module" src="js/login.js"></script>
</head>

<body>

    <div id="authContainer">

        <!-- LOGIN FORM -->
        <div id="loginForm">
            <h2>Login</h2>

            <div class="authRow">
                <label>Email</label>
                <input id="loginEmail" type="email">
            </div>

            <div class="authRow">
                <label>Password</label>
                <input id="loginPassword" type="password">
            </div>

            <button onclick="handleLogin()">Login</button>

            <div class="switchLink" onclick="showSignup()">Create an account</div>
            <div class="switchLink" onclick="showForgotEmail()">Forgot your email?</div>

            <div id="login-error" class="errorBox"></div>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signupForm" style="display:none;">
            <h2>Sign Up</h2>

            <div class="authRow">
                <label>Email</label>
                <input id="signupEmail" type="email">
            </div>

            <div class="authRow">
                <label>Password</label>
                <input id="signupPassword" type="password">
            </div>

            <div class="authRow">
                <label>Nickname</label>
                <input id="signupNickname" type="text">
            </div>

            <button onclick="handleSignup()">Sign Up</button>

            <div class="switchLink" onclick="showLogin()">Already have an account?</div>
            <div id="signup-error" class="errorBox"></div>
        </div>

        <!-- FORGOTTEN EMAIL FORM -->
        <div id="forgotEmailForm" style="display:none;">
            <h2>Recover Email</h2>

            <div class="authRow">
                <label>Enter your nickname</label>
                <input id="recoverNickname" type="text">
            </div>

            <button onclick="handleRecoverEmail()">Send recovery email</button>

            <div class="switchLink" onclick="showLogin()">Back to login</div>
            <div id="recover-error" class="errorBox"></div>
            <div id="recover-success" class="errorBox" style="color:green;"></div>
        </div>

    </div>

    <script>
        function showLogin() {
            document.getElementById("loginForm").style.display = "block";
            document.getElementById("signupForm").style.display = "none";
            document.getElementById("forgotEmailForm").style.display = "none";
        }

        function showSignup() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("signupForm").style.display = "block";
            document.getElementById("forgotEmailForm").style.display = "none";
        }

        function showForgotEmail() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("signupForm").style.display = "none";
            document.getElementById("forgotEmailForm").style.display = "block";
        }

        async function handleLogin() {
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value.trim();
            const errorBox = document.getElementById("login-error");

            const result = await login(email, password);

            if (result.error) {
                errorBox.textContent = result.error;
                errorBox.style.display = "block";
                return;
            }
        }

        async function handleSignup() {
            const email = document.getElementById("signupEmail").value.trim();
            const password = document.getElementById("signupPassword").value.trim();
            const nickname = document.getElementById("signupNickname").value.trim();
            const errorBox = document.getElementById("signup-error");

            const result = await signup(email, password, nickname);

            if (result.error) {
                errorBox.textContent = result.error;
                errorBox.style.display = "block";
                return;
            }
        }

        async function handleRecoverEmail() {
            const nickname = document.getElementById("recoverNickname").value.trim();
            const errorBox = document.getElementById("recover-error");
            const successBox = document.getElementById("recover-success");

            const result = await recoverEmail(nickname);

            if (result.error) {
                errorBox.textContent = result.error;
                errorBox.style.display = "block";
                successBox.style.display = "none";
                return;
            }

            errorBox.style.display = "none";
            successBox.textContent = result.message;
            successBox.style.display = "block";
        }
    </script>

</body>

</html>
