<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup</title>

    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/login.css">

    <script type="module" src="./scripts/login.js"></script>
</head>

<body>

    <div id="authContainer">

        <!-- LOGIN FORM -->
        <div id="loginForm">
            <h2>Login</h2>

            <div class="authRow">
                <label>Email</label>
                <input id="loginEmail" type="email">
            </div>

            <div class="authRow">
                <label>Password</label>
                <input id="loginPassword" type="password">
            </div>

            <button class="closeBtn" onclick="login()">Login</button>

            <div class="switchLink" onclick="showSignup()">Create an account</div>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signupForm" style="display:none;">
            <h2>Sign Up</h2>

            <div class="authRow">
                <label>Nickname</label>
                <input id="signupNickname" type="text">
            </div>

            <div class="authRow">
                <label>Email</label>
                <input id="signupEmail" type="email">
            </div>

            <div class="authRow">
                <label>Password</label>
                <input id="signupPassword" type="password">
            </div>

            <button class="closeBtn" onclick="signup()">Sign Up</button>

            <div class="switchLink" onclick="showLogin()">Already have an account?</div>
        </div>

    </div>

</body>

</html>
