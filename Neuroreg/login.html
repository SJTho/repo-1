<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup</title>

    <link rel="stylesheet" href="./mcqcore.css">

    <style>
        #authContainer {
            width: 80%;
            max-width: 450px;
            margin: 60px auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .authRow {
            margin-bottom: 16px;
        }

        .authRow label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #000;
        }

        .authRow input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: none;
            background: #f2f2f2;
            border-radius: 6px;
            outline: none;
            color: #000;
        }

        .switchLink {
            text-align: center;
            margin-top: 20px;
            cursor: pointer;
            color: #0077cc;
            font-weight: 600;
        }
    </style>

    <script type="module">
        import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

        const supabaseUrl = "https://jzdvtqkssamxndgrttct.supabase.co";
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6ZHZ0cWtzc2FteG5kZ3J0dGN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNDQ1NzAsImV4cCI6MjEwMTkyMDU3MH0.CHKV56rf8ZSwwKIN0fuzEBuPoxn8qwSW0YzW_1DFcgM";   // insert your anon key
        const supabase = createClient(supabaseUrl, supabaseKey);

        /* ----------------------------------------------------
           Switch between Login and Signup views
        ---------------------------------------------------- */
        function showLogin() {
            document.getElementById("loginForm").style.display = "block";
            document.getElementById("signupForm").style.display = "none";
        }

        function showSignup() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("signupForm").style.display = "block";
        }

        /* ----------------------------------------------------
           Signup RPC
        ---------------------------------------------------- */
        async function signup() {
            const nickname = document.getElementById("signupNickname").value.trim();
            const password = document.getElementById("signupPassword").value.trim();

            const {data, error} = await supabase.rpc("signup", {
                nickname_input: nickname,
                password_input: password
            });

            if (error) {
                alert("Signup failed.");
                console.error(error);
                return;
            }

            alert("Signup successful. You can now log in.");
            showLogin();
        }

        /* ----------------------------------------------------
           Login RPC
        ---------------------------------------------------- */
        async function login() {
            const nickname = document.getElementById("loginNickname").value.trim();
            const password = document.getElementById("loginPassword").value.trim();

            const {data: token, error} = await supabase.rpc("login", {
                nickname_input: nickname,
                password_input: password
            });

            if (error) {
                alert("Login failed.");
                console.error(error);
                return;
            }

            // Store JWT token
            localStorage.setItem("sessionToken", token);

            // Store nickname for convenience
            localStorage.setItem("nickname", nickname);

            // Redirect to profile page
            window.location.href = "profile.html";
        }

        /* ----------------------------------------------------
           Expose functions globally for onclick=""
        ---------------------------------------------------- */
        window.login = login;
        window.signup = signup;
        window.showLogin = showLogin;
        window.showSignup = showSignup;

        window.addEventListener("DOMContentLoaded", () => {
            showLogin(); // default view
        });
    </script>
</head>

<body>

    <div id="authContainer">

        <!-- LOGIN FORM -->
        <div id="loginForm">
            <h2>Login</h2>

            <div class="authRow">
                <label>Nickname</label>
                <input id="loginNickname" type="text">
            </div>

            <div class="authRow">
                <label>Password</label>
                <input id="loginPassword" type="password">
            </div>

            <button class="closeBtn" onclick="login()">Login</button>

            <div class="switchLink" onclick="showSignup()">Create an account</div>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signupForm" style="display:none;">
            <h2>Sign Up</h2>

            <div class="authRow">
                <label>Nickname</label>
                <input id="signupNickname" type="text">
            </div>

            <div class="authRow">
                <label>Password</label>
                <input id="signupPassword" type="password">
            </div>

            <button class="closeBtn" onclick="signup()">Sign Up</button>

            <div class="switchLink" onclick="showLogin()">Already have an account?</div>
        </div>

    </div>

</body>
