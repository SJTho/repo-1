<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login / Signup</title>

    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/login.css">

    <!-- Google reCAPTCHA v2 Invisible -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <!-- Your login logic -->
    <script type="module" src="./scripts/login.js"></script>
</head>

<body>

    <div id="authContainer">

        <!-- LOGIN FORM -->
        <div id="loginForm">
            <h2>Login</h2>

            <div class="authRow">
                <label>Email</label>
                <input id="loginEmail" type="email">
            </div>

            <div class="authRow">
                <label>Password</label>
                <input id="loginPassword" type="password">
            </div>

            <div class="forgotPasswordLink" onclick="showForgotEmail()">Forgot your password?</div>

            <button onclick="handleLogin()">Login</button>

            <div class="switchLink" onclick="showSignup()">Create an account</div>

            <div id="login-error" class="errorBox"></div>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signupForm" style="display:none;">
            <h2>Sign Up</h2>

            <div class="authRow">
                <label>Email</label>
                <input id="signupEmail" type="email">
            </div>

            <div class="authRow">
                <label>Password</label>
                <input id="signupPassword" type="password">
            </div>

            <div class="authRow">
                <label>Nickname</label>
                <input id="signupNickname" type="text">
            </div>

            <!-- Invisible reCAPTCHA button (site key MUST be here) -->
            <button class="g-recaptcha" data-sitekey="6LeqQqwtAAAAABsJvflDXP7PsiWkuGlCri-xUFMz"
                data-callback="onSignupCaptcha" data-size="invisible">
                Sign Up
            </button>

            <div class="switchLink" onclick="showLogin()">Already have an account?</div>

            <div id="signup-error" class="errorBox"></div>
        </div>

        <!-- FORGOTTEN PASSWORD FORM -->
        <div id="forgotEmailForm" style="display:none;">
            <h2>Recover Password</h2>

            <div class="authRow">
                <label>Enter your nickname</label>
                <input id="recoverNickname" type="text">
            </div>

            <button onclick="handleRecoverEmail()">Send recovery email</button>

            <div class="switchLink" onclick="showLogin()">Back to login</div>

            <div id="recover-error" class="errorBox"></div>
            <div id="recover-success" class="errorBox" style="color:green;"></div>
        </div>

    </div>

    <script>
        // Clear all error boxes
        function clearErrors() {
            document.querySelectorAll(".errorBox").forEach(box => {
                box.style.display = "none";
                box.textContent = "";
            });
        }

        // Toggle functions
        function showLogin() {
            clearErrors();
            document.getElementById("loginForm").style.display = "block";
            document.getElementById("signupForm").style.display = "none";
            document.getElementById("forgotEmailForm").style.display = "none";
        }

        function showSignup() {
            clearErrors();
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("signupForm").style.display = "block";
            document.getElementById("forgotEmailForm").style.display = "none";
        }

        function showForgotEmail() {
            clearErrors();
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("signupForm").style.display = "none";
            document.getElementById("forgotEmailForm").style.display = "block";
        }

        // Login handler
        async function handleLogin() {
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value.trim();
            const errorBox = document.getElementById("login-error");

            const result = await login(email, password);

            if (result.error) {
                errorBox.textContent = result.error;
                errorBox.style.display = "block";
                return;
            }
        }

        // Forgotten password handler
        async function handleRecoverEmail() {
            const nickname = document.getElementById("recoverNickname").value.trim();
            const errorBox = document.getElementById("recover-error");
            const successBox = document.getElementById("recover-success");

            const result = await recoverEmail(nickname);

            if (result.error) {
                errorBox.textContent = result.error;
                errorBox.style.display = "block";
                successBox.style.display = "none";
                return;
            }

            errorBox.style.display = "none";
            successBox.textContent = result.message;
            successBox.style.display = "block";
        }
    </script>

</body>

</html>
