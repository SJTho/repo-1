<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup</title>

    <link rel="stylesheet" href="./mcqcore.css">

    <style>
        #authContainer {
            width: 80%;
            max-width: 450px;
            margin: 60px auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .authRow {
            margin-bottom: 16px;
        }

        .authRow label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #000;
        }

        .authRow input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: none;
            background: #f2f2f2;
            border-radius: 6px;
            outline: none;
            color: #000;
        }

        .switchLink {
            text-align: center;
            margin-top: 20px;
            cursor: pointer;
            color: #0077cc;
            font-weight: 600;
        }

        /* Narrow Back button override */
        button.closeBtn.backBtn {
            width: 120px;
            margin: 20px auto 0;
            display: block;
            padding: 8px 12px;
            font-size: 16px;
            background: #14233d;
            color: white;
        }
    </style>

    <script type="module">
        import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
        import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        /* ----------------------------------------------------
           Switch between Login and Signup views
        ---------------------------------------------------- */
        function showLogin() {
            document.getElementById("loginForm").style.display = "block";
            document.getElementById("signupForm").style.display = "none";
        }

        function showSignup() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("signupForm").style.display = "block";
        }

        /* ----------------------------------------------------
           Signup RPC
        ---------------------------------------------------- */
        async function signup() {
            const nickname = document.getElementById("signupNickname").value.trim();
            const password = document.getElementById("signupPassword").value.trim();

            if (!nickname || !password) {
                alert("Please fill in all fields.");
                return;
            }

            const {data, error} = await supabase.rpc("signup", {
                nickname_input: nickname,
                password_input: password
            });

            if (error) {
                alert("Signup failed: " + error.message);
                return;
            }

            alert("Signup successful. You can now log in.");
            showLogin();
        }

        /* ----------------------------------------------------
           Login RPC + Rank Lookup
        ---------------------------------------------------- */
        async function login() {
            const nickname = document.getElementById("loginNickname").value.trim();
            const password = document.getElementById("loginPassword").value.trim();

            if (!nickname || !password) {
                alert("Please fill in all fields.");
                return;
            }

            const {data, error} = await supabase.rpc("login", {
                nickname_input: nickname,
                password_input: password
            });

            if (error) {
                alert("Login failed: " + error.message);
                return;
            }

            let user;

            if (Array.isArray(data)) {
                user = data[0]?.login || data[0];
            } else {
                user = data;
            }

            if (!user || user.error) {
                alert("Invalid nickname or password");
                return;
            }

            /* Store session data */
            localStorage.setItem("sessionToken", user.token);
            localStorage.setItem("nickname", user.nickname);
            localStorage.setItem("scalpel_points", user.scalpel_points);
            localStorage.setItem("userId", user.id);

            /* ----------------------------------------------------
               NEW: Fetch rank based on scalpel_points
            ---------------------------------------------------- */
            const points = user.scalpel_points;

            const {data: rankData, error: rankError} = await supabase
                .from("rank")
                .select("rank")
                .lte("minimum_score", points)
                .gte("maximum_score", points)
                .maybeSingle();

            if (rankError) {
                console.error("Rank lookup failed:", rankError);
                localStorage.setItem("rank", "Unranked");
            } else {
                localStorage.setItem("rank", rankData?.rank || "Unranked");
            }

            /* Redirect after storing rank */
            window.location.href = "index.html";
        }

        /* ----------------------------------------------------
           Expose functions globally
        ---------------------------------------------------- */
        window.login = login;
        window.signup = signup;
        window.showLogin = showLogin;
        window.showSignup = showSignup;

        window.addEventListener("DOMContentLoaded", () => {
            showLogin();
        });
    </script>
</head>

<body>

    <div id="authContainer">

        <!-- LOGIN FORM -->
        <div id="loginForm">
            <h2>Login</h2>

            <div class="authRow">
                <label>Nickname</label>
                <input id="loginNickname" type="text">
            </div>

            <div class="authRow">
                <label>Password</label>
                <input id="loginPassword" type="password">
            </div>

            <button class="closeBtn" onclick="login()">Login</button>

            <div class="switchLink" onclick="showSignup()">Create an account</div>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signupForm" style="display:none;">
            <h2>Sign Up</h2>

            <div class="authRow">
                <label>Nickname</label>
                <input id="signupNickname" type="text">
            </div>

            <div class="authRow">
                <label>Password</label>
                <input id="signupPassword" type="password">
            </div>

            <button class="closeBtn" onclick="signup()">Sign Up</button>

            <div class="switchLink" onclick="showLogin()">Already have an account?</div>
        </div>

        <!-- Back button -->
        <button class="closeBtn backBtn" onclick="window.location.href='index.html'">Back</button>

    </div>

</body>

</html>
