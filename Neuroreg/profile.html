<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroReg – Profile</title>

    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/profile.css">
</head>

<body>

    <!-- Hamburger -->
    <div id="hamburgerMenu" class="hamburgerIcon">☰</div>
    <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>

    <!-- Top-right icons -->
    <div id="topRightIcons"></div>

    <h1>My Profile</h1>

    <div id="error-message" class="errorMessage"></div>

    <div id="profileContainer">

        <!-- Nickname -->
        <div class="profileRow">
            <strong>Nickname</strong>
            <div class="profileFieldRow">
                <span id="nicknameDisplay"></span>
                <input id="nicknameInput" class="editField" style="display:none;">
                <button id="editNicknameBtn" class="editBtn">Edit</button>
                <button id="saveNicknameBtn" class="saveBtn" style="display:none;">Save</button>
            </div>
        </div>

        <!-- Email -->
        <div class="profileRow">
            <strong>Email</strong>
            <div class="profileFieldRow">
                <span id="emailDisplay"></span>
                <input id="emailInput" class="editField" style="display:none;">
                <button id="editEmailBtn" class="editBtn">Edit</button>
                <button id="saveEmailBtn" class="saveBtn" style="display:none;">Save</button>
            </div>
        </div>

        <!-- Password -->
        <div class="profileRow">
            <strong>Password</strong>
            <div class="profileFieldRow">
                <span id="passwordDisplay">********</span>
                <input id="passwordInput" class="editField" style="display:none;" type="password">
                <button id="editPasswordBtn" class="editBtn">Edit</button>
                <button id="savePasswordBtn" class="saveBtn" style="display:none;">Save</button>
            </div>
        </div>

        <!-- ⭐ Best Streak -->
        <div class="profileRow">
            <strong>Best streak</strong>
            <div class="profileFieldRow">
                <span id="longestStreakDisplay">0 days</span>
            </div>
        </div>

        <!-- ⭐ Current Streak -->
        <div class="profileRow">
            <strong>Current streak</strong>
            <div class="profileFieldRow">
                <span id="currentStreakDisplay">0 days</span>
            </div>
        </div>

        <!-- Scalpel Points -->
        <div class="profileRow">
            <strong>Scalpel Points</strong>
            <div class="profileFieldRow">
                <span id="pointsDisplay"></span>
            </div>
        </div>

        <!-- Rank -->
        <div class="profileRow">
            <strong>Rank</strong>
            <div class="profileFieldRow">
                <span id="rankDisplay"></span>
            </div>
        </div>

    </div>

    <script type="module" src="./scripts/profile.js"></script>

</body>

</html>
