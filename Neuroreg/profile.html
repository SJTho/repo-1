<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Your Profile</title>

    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/profile.css" />

    <!-- Supabase client + profile.js -->
    <script type="module" src="scripts/profile.js"></script>
</head>

<body>

    <!-- Top-right icons -->
    <div id="topRightIcons" class="top-right-icons"></div>

    <!-- Hamburger -->
    <div id="hamburgerMenu" class="hamburger">☰</div>
    <div id="hamburgerMenuDropdown" class="hamburger-dropdown"></div>

    <div class="profile-container">
        <h1>Your Profile</h1>

        <div id="profile-content">

            <!-- Nickname -->
            <div class="profile-row">
                <label>Nickname:</label>
                <span id="nicknameDisplay"></span>
                <input id="nicknameInput" class="profile-input" style="display:none;" />
                <button id="editNicknameBtn" class="profile-btn">Edit</button>
                <button id="saveNicknameBtn" class="profile-btn" style="display:none;">Save</button>
            </div>

            <!-- Email -->
            <div class="profile-row">
                <label>Email:</label>
                <span id="emailDisplay"></span>
                <input id="emailInput" class="profile-input" style="display:none;" />
                <button id="editEmailBtn" class="profile-btn">Edit</button>
                <button id="saveEmailBtn" class="profile-btn" style="display:none;">Save</button>
            </div>

            <!-- Scalpel Points -->
            <div class="profile-row">
                <label>Scalpel Points:</label>
                <span id="pointsDisplay"></span>
            </div>

            <!-- Rank -->
            <div class="profile-row">
                <label>Rank:</label>
                <span id="rankDisplay"></span>
            </div>

            <!-- Subscribed -->
            <div class="profile-row">
                <label>Subscribed:</label>
                <span id="subscribedDisplay"></span>
                <button id="toggleSubscribedBtn" class="profile-btn">Toggle</button>
            </div>

            <!-- Admin -->
            <div class="profile-row">
                <label>Admin:</label>
                <span id="adminDisplay"></span>
            </div>

            <!-- Logout -->
            <button id="logoutBtn" class="logout-button">Logout</button>

        </div>

        <p id="error-message" class="error-message"></p>
    </div>

</body>

</html>
