<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <link rel="stylesheet" href="./mcqcore.css">
    <link rel="stylesheet" href="./profile.css">

    <style>
        #profileContainer {
            width: 80%;
            max-width: 500px;
            margin: 60px auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .profileRow {
            margin-bottom: 16px;
            font-size: 18px;
            color: #000;
        }

        .profileRow strong {
            display: inline-block;
            width: 160px;
        }
    </style>

    <script type="module">
        import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
        import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

        const supabase = createClient(supabaseUrl, supabaseKey);

        /* ----------------------------------------------------
           Logout
        ---------------------------------------------------- */
        function logout() {
            localStorage.removeItem("sessionToken");
            localStorage.removeItem("nickname");
            localStorage.removeItem("userId");

            window.location.href = "login.html";
        }
        window.logout = logout;

        /* ----------------------------------------------------
           Load Profile Data
        ---------------------------------------------------- */
        async function loadProfile() {
            const token = localStorage.getItem("sessionToken");

            if (!token) {
                window.location.href = "login.html";
                return;
            }
            // Decode JWT payload
            const payload = JSON.parse(atob(token.split('.')[1]));

            // Use the correct claim
            const userId = payload.sub;

            // Fetch user data
            const {data, error} = await supabase
                .from("users")
                .select("nickname, password_hash, scalpel_points")
                .eq("id", userId)
                .single();

            if (error) {
                console.error(error);
                alert("Failed to load profile.");
                return;
            }

            // Populate the page
            document.getElementById("nicknameDisplay").innerText = data.nickname;
            document.getElementById("passwordDisplay").innerText = data.password_hash;
            document.getElementById("pointsDisplay").innerText = data.scalpel_points;
        }

        window.loadProfile = loadProfile;

        window.addEventListener("DOMContentLoaded", loadProfile);
    </script>
</head>

<body>

    <div id="profileContainer">

        <h2>My Profile</h2>

        <div class="profileRow">
            <strong>Nickname:</strong> <span id="nicknameDisplay"></span>
        </div>

        <div class="profileRow">
            <strong>Password Hash:</strong> <span id="passwordDisplay"></span>
        </div>

        <div class="profileRow">
            <strong>Scalpel Points:</strong> <span id="pointsDisplay"></span>
        </div>

        <button class="closeBtn" onclick="logout()">Logout</button>

    </div>

</body>

</html>
