<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <link rel="stylesheet" href="./mcqcore.css">
    <link rel="stylesheet" href="./profile.css">

    <style>
        #profileContainer {
            width: 80%;
            max-width: 500px;
            margin: 120px auto 60px auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        #profileContainer h2 {
            color: #000;
            text-align: center;
            margin-bottom: 24px;
        }

        .profileRow {
            margin-bottom: 24px;
            font-size: 18px;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .profileRow strong {
            margin-bottom: 6px;
        }

        .editBtn,
        .saveBtn,
        .closeBtn {
            margin-top: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .editBtn {
            background: #007bff;
            color: white;
        }

        .saveBtn {
            background: #28a745;
            color: white;
        }

        .closeBtn {
            background: #14233d;
            color: white;
            width: 100%;
            margin-top: 20px;
        }

        input.editField {
            font-size: 18px;
            padding: 10px 12px;
            width: 100%;
            box-sizing: border-box;
            background: #e0e0e0;
            border: 1px solid #b5b5b5;
            border-radius: 6px;
            color: #000;
        }

        @media (max-width: 600px) {
            #profileContainer {
                width: 95%;
                padding: 28px;
                margin-top: 80px;
                border-radius: 14px;
            }

            #profileContainer h2 {
                font-size: 26px;
                margin-bottom: 28px;
            }

            .profileRow {
                font-size: 20px;
                margin-bottom: 28px;
            }

            .profileRow strong {
                font-size: 20px;
                margin-bottom: 10px;
            }

            .profileRow span {
                font-size: 20px;
            }

            input.editField {
                font-size: 20px;
                padding: 12px 14px;
                background: #d6d6d6;
                border: 1px solid #a8a8a8;
            }
        }

        .editBtn,
        .saveBtn {
            font-size: 18px;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .closeBtn {
            font-size: 20px;
            padding: 14px 20px;
            border-radius: 10px;
            margin-top: 30px;
        }

        .hamburgerIcon {
            font-size: 30px;
            padding: 12px;
        }

        .topRightIcon {
            font-size: 28px;
            padding: 10px;
        }

        .dropdownItem {
            font-size: 20px;
            padding: 14px;
        }

        .dropdownSeparator {
            width: 100%;
            height: 1px;
            background: #ccc;
            margin: 6px 0;
        }
    </style>

    <script type="module">
        import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
        import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        /* ----------------------------------------------------
           Load Profile
        ---------------------------------------------------- */
        function loadProfile() {
            const token = localStorage.getItem("sessionToken");

            if (!token) {
                window.location.href = "login.html";
                return;
            }

            const nickname = localStorage.getItem("nickname");
            const scalpelPoints = localStorage.getItem("scalpel_points");
            const rank = localStorage.getItem("rank");

            document.getElementById("nicknameDisplay").innerText = nickname ?? "N/A";
            document.getElementById("pointsDisplay").innerText = scalpelPoints ?? "0";
            document.getElementById("rankDisplay").innerText = rank ?? "Unranked";
            document.getElementById("passwordDisplay").innerText = "********";
        }

        window.addEventListener("DOMContentLoaded", loadProfile);

        /* ----------------------------------------------------
           Editing Logic
        ---------------------------------------------------- */
        function enableEdit(fieldId, btnId, saveBtnId) {
            const span = document.getElementById(fieldId);
            const currentValue = span.innerText;

            const input = document.createElement("input");
            input.className = "editField";
            input.value = currentValue;

            span.replaceWith(input);

            document.getElementById(btnId).style.display = "none";
            document.getElementById(saveBtnId).style.display = "inline-block";

            return input;
        }

        async function saveField(inputEl, localStorageKey, supabaseColumn) {
            const newValue = inputEl.value.trim();
            const userId = localStorage.getItem("userId");

            localStorage.setItem(localStorageKey, newValue);

            let rpcName;
            let rpcArgs;

            if (supabaseColumn === "nickname") {
                rpcName = "update_nickname";
                rpcArgs = {user_id: userId, new_nickname: newValue};
            } else if (supabaseColumn === "password_hash") {
                rpcName = "update_password";
                rpcArgs = {user_id: userId, new_password: newValue};
            }

            const {error} = await supabase.rpc(rpcName, rpcArgs);

            if (error) {
                console.error(error);
                alert("Failed to save to Supabase: " + error.message);
                return;
            }

            window.location.reload();
        }

        window.startEditNickname = () => {
            window.nicknameInput = enableEdit("nicknameDisplay", "editNicknameBtn", "saveNicknameBtn");
        };

        window.saveNickname = () => {
            saveField(window.nicknameInput, "nickname", "nickname");
        };

        window.startEditPassword = () => {
            window.passwordInput = enableEdit("passwordDisplay", "editPasswordBtn", "savePasswordBtn");
        };

        window.savePassword = () => {
            saveField(window.passwordInput, "password_hash", "password_hash");
        };

        /* ----------------------------------------------------
           Load Hamburger Menu from Supabase
        ---------------------------------------------------- */
        async function loadHamburgerMenu() {
            const dropdown = document.getElementById("hamburgerMenuDropdown");

            const isAdmin = localStorage.getItem("isAdmin") === "true";

            const {data, error} = await supabase
                .from("menuitems")
                .select("*")
                .order("section", {ascending: true})
                .order("order", {ascending: true});

            if (error) {
                console.error("Menu load error:", error);
                dropdown.innerHTML = "<div class='dropdownItem'>Menu failed to load</div>";
                return;
            }

            let currentSection = null;

            data.forEach(item => {
                if (item.admin && !isAdmin) return;

                if (currentSection !== null && item.section !== currentSection) {
                    const separator = document.createElement("div");
                    separator.className = "dropdownSeparator";
                    dropdown.appendChild(separator);
                }

                currentSection = item.section;

                const div = document.createElement("div");
                div.className = "dropdownItem";
                div.innerText = item.displayname;
                div.onclick = () => window.location.href = item.url;

                dropdown.appendChild(div);
            });
        }

        window.addEventListener("DOMContentLoaded", loadHamburgerMenu);
    </script>
</head>

<body>

    <!-- Top-left hamburger -->
    <div id="hamburgerMenu" class="hamburgerIcon">☰</div>

    <!-- Dropdown Menu -->
    <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>

    <!-- Top-right icons -->
    <div id="topRightIcons">
        <div id="rankIcon" class="topRightIcon" onclick="window.location.href='rank.html'">🏅</div>
        <div id="homeIcon" class="topRightIcon" onclick="window.location.href='index.html'">🏠</div>
        <div id="helpButton" class="topRightIcon" onclick="window.location.href='help.html'">❔</div>
    </div>

    <script>
        const hamburger = document.getElementById("hamburgerMenu");
        const dropdown = document.getElementById("hamburgerMenuDropdown");

        hamburger.addEventListener("click", () => {
            dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
        });

        document.addEventListener("click", (event) => {
            if (!hamburger.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.style.display = "none";
            }
        });
    </script>

    <div id="profileContainer">

        <h2>My Profile</h2>

        <div class="profileRow">
            <strong>Nickname</strong>
            <span id="nicknameDisplay"></span>
            <button id="editNicknameBtn" class="editBtn" onclick="startEditNickname()">Edit</button>
            <button id="saveNicknameBtn" class="saveBtn" onclick="saveNickname()" style="display:none;">Save</button>
        </div>

        <div class="profileRow">
            <strong>Password</strong>
            <span id="passwordDisplay"></span>
            <button id="editPasswordBtn" class="editBtn" onclick="startEditPassword()">Edit</button>
            <button id="savePasswordBtn" class="saveBtn" onclick="savePassword()" style="display:none;">Save</button>
        </div>

        <div class="profileRow">
            <strong>Scalpel Points</strong>
            <span id="pointsDisplay"></span>
        </div>

        <div class="profileRow">
            <strong>Rank</strong>
            <span id="rankDisplay"></span>
        </div>

        <button class="closeBtn" onclick="window.location.href='index.html'">Back</button>

    </div>

</body>

</html>
