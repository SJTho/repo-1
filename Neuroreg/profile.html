<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/profile.css">

    <!-- MUST BE FIRST: GLOBAL LOGOUT IMPORT -->
    <script type="module">
        import {logout} from "./scripts/logout.js";
        window.logout = logout;
    </script>

    <!-- Supabase client -->
    <script type="module">
        import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
        import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";
        window.supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>

    <script type="module" src="./scripts/profile.js"></script>
</head>

<body>

    <div id="hamburgerMenu" class="hamburgerIcon">☰</div>
    <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>
    <div id="topRightIcons"></div>

    <div id="profileContainer">

        <h2>My Profile</h2>

        <!-- Nickname -->
        <div class="profileRow">
            <strong>Nickname</strong>

            <div class="profileFieldRow">
                <span id="nicknameDisplay"></span>
                <input id="nicknameInput" class="editField" style="display:none;">

                <button id="editNicknameBtn" class="editBtn" onclick="startEditNickname()">Edit</button>
                <button id="saveNicknameBtn" class="saveBtn" onclick="saveNickname()"
                    style="display:none;">Save</button>
            </div>
        </div>

        <!-- Password -->
        <div class="profileRow">
            <strong>Password</strong>

            <div class="profileFieldRow">
                <span id="passwordDisplay">********</span>
                <input id="passwordInput" class="editField" style="display:none;">

                <button id="editPasswordBtn" class="editBtn" onclick="startEditPassword()">Edit</button>
                <button id="savePasswordBtn" class="saveBtn" onclick="savePassword()"
                    style="display:none;">Save</button>
            </div>
        </div>

        <!-- Points -->
        <div class="profileRow">
            <strong>Scalpel Points</strong>
            <span id="pointsDisplay"></span>
        </div>

        <!-- Rank -->
        <div class="profileRow">
            <strong>Rank</strong>
            <span id="rankDisplay"></span>
        </div>

        <button class="closeBtn" onclick="window.location.href='index.html'">Back</button>

    </div>

</body>

</html>
