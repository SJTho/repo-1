<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <link rel="stylesheet" href="./mcqcore.css">
    <link rel="stylesheet" href="./profile.css">

    <style>
        #profileContainer {
            width: 80%;
            max-width: 500px;
            margin: 60px auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        #profileContainer h2 {
            color: #000;
            text-align: center;
            margin-bottom: 24px;
        }

        .profileRow {
            margin-bottom: 24px;
            /* increased spacing */
            font-size: 18px;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .profileRow strong {
            margin-bottom: 6px;
        }

        .editBtn,
        .saveBtn {
            margin-top: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .editBtn {
            background: #007bff;
            color: white;
        }

        .saveBtn {
            background: #28a745;
            color: white;
        }

        input.editField {
            font-size: 18px;
            padding: 6px;
            width: 100%;
            box-sizing: border-box;
        }
    </style>

    <script type="module">
        import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
        import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        function logout() {
            localStorage.removeItem("sessionToken");
            localStorage.removeItem("nickname");
            localStorage.removeItem("scalpel_points");
            localStorage.removeItem("rank");
            localStorage.removeItem("userId");

            window.location.href = "login.html";
        }
        window.logout = logout;

        function enableEdit(fieldId, btnId, saveBtnId) {
            const span = document.getElementById(fieldId);
            const currentValue = span.innerText;

            const input = document.createElement("input");
            input.className = "editField";
            input.value = currentValue;

            span.replaceWith(input);

            document.getElementById(btnId).style.display = "none";
            document.getElementById(saveBtnId).style.display = "inline-block";

            return input;
        }

        async function saveField(inputEl, localStorageKey, supabaseColumn) {
            const newValue = inputEl.value.trim();
            const userId = localStorage.getItem("userId");

            // Save locally
            localStorage.setItem(localStorageKey, newValue);

            // Save to Supabase
            const {error} = await supabase
                .from("users")
                .update({[supabaseColumn]: newValue})
                .eq("id", userId);

            if (error) {
                console.error(error);
                alert("Failed to save to Supabase.");
                return;
            }

            // Refresh page
            window.location.reload();
        }

        function loadProfile() {
            const token = localStorage.getItem("sessionToken");

            if (!token) {
                window.location.href = "login.html";
                return;
            }

            const nickname = localStorage.getItem("nickname");
            const scalpelPoints = localStorage.getItem("scalpel_points");
            const rank = localStorage.getItem("rank");

            document.getElementById("nicknameDisplay").innerText = nickname ?? "N/A";
            document.getElementById("pointsDisplay").innerText = scalpelPoints ?? "0";
            document.getElementById("rankDisplay").innerText = rank ?? "Unranked";
            document.getElementById("passwordDisplay").innerText = "********";
        }

        window.loadProfile = loadProfile;
        window.addEventListener("DOMContentLoaded", loadProfile);

        // Nickname editing
        window.startEditNickname = () => {
            const input = enableEdit("nicknameDisplay", "editNicknameBtn", "saveNicknameBtn");
            window.nicknameInput = input;
        };
        window.saveNickname = () => {
            saveField(window.nicknameInput, "nickname", "nickname");
        };

        // Password editing
        window.startEditPassword = () => {
            const input = enableEdit("passwordDisplay", "editPasswordBtn", "savePasswordBtn");
            window.passwordInput = input;
        };
        window.savePassword = () => {
            saveField(window.passwordInput, "password_hash", "password_hash");
        };
    </script>
</head>

<body>

    <div id="profileContainer">

        <h2>My Profile</h2>

        <div class="profileRow">
            <strong>Nickname</strong>
            <span id="nicknameDisplay"></span>
            <button id="editNicknameBtn" class="editBtn" onclick="startEditNickname()">Edit</button>
            <button id="saveNicknameBtn" class="saveBtn" onclick="saveNickname()" style="display:none;">Save</button>
        </div>

        <div class="profileRow">
            <strong>Password</strong>
            <span id="passwordDisplay"></span>
            <button id="editPasswordBtn" class="editBtn" onclick="startEditPassword()">Edit</button>
            <button id="savePasswordBtn" class="saveBtn" onclick="savePassword()" style="display:none;">Save</button>
        </div>

        <div class="profileRow">
            <strong>Scalpel Points</strong>
            <span id="pointsDisplay"></span>
        </div>

        <div class="profileRow">
            <strong>Rank</strong>
            <span id="rankDisplay"></span>
        </div>

        <button class="closeBtn" onclick="logout()">Logout</button>

    </div>

</body>

</html>
