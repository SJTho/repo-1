<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta-name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rank</title>

        <link rel="stylesheet" href="./mcqcore.css">
        <link rel="stylesheet" href="./rank.css">

        <style>
            #profileContainer {
                width: 80%;
                max-width: 600px;
                margin: 120px auto 60px auto;
                background: #ffffff;
                padding: 24px;
                border-radius: 12px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }

            #rankHeading {
                color: #000 !important;
                text-align: center;
                margin-bottom: 24px;
            }

            #rankList {
                margin-top: 20px;
                width: 100%;
            }

            .rankRow {
                display: grid;
                grid-template-columns: 60px 1fr 100px;
                padding: 10px;
                border-bottom: 1px solid #ddd;
                font-size: 18px;
            }

            .rankRow div {
                color: #000 !important;
            }

            .rankPosition {
                font-weight: bold;
                color: #14233d !important;
            }

            .rankNickname {
                font-weight: 500;
                color: #000 !important;
            }

            .rankPoints {
                text-align: right;
                font-weight: bold;
                color: #007bff !important;
            }

            .closeBtn {
                background: #14233d;
                color: white;
                width: 100%;
                margin-top: 20px;
                padding: 10px;
                border-radius: 6px;
                border: none;
                cursor: pointer;
            }
        </style>

        <script type="module">
            import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
            import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

            const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

            async function loadRankPage() {
                const token = localStorage.getItem("sessionToken");
                if (!token) {
                    window.location.href = "login.html";
                    return;
                }

                const userRank = localStorage.getItem("rank");
                const userPoints = Number(localStorage.getItem("scalpel_points"));

                document.getElementById("rankHeading").innerText = `${userRank} top ten`;

                const {data: rankRows} = await supabase
                    .from("rank")
                    .select("minimum_score, maximum_score")
                    .eq("rank", userRank)
                    .limit(1);

                const rankData = rankRows?.[0];
                if (!rankData) return;

                const min = rankData.minimum_score;
                const max = rankData.maximum_score;

                const {data: users, error} = await supabase.rpc(
                    "get_users_in_rank_range",
                    {min_score: min, max_score: max}
                );

                if (error) {
                    console.error("RPC error:", error);
                    return;
                }

                const container = document.getElementById("rankList");
                container.innerHTML = "";

                const topTen = users.slice(0, 10);

                topTen.forEach((u, index) => {
                    const row = document.createElement("div");
                    row.className = "rankRow";
                    row.innerHTML = `
                    <div class="rankPosition">${index + 1}</div>
                    <div class="rankNickname">${u.nickname}</div>
                    <div class="rankPoints">${u.scalpel_points}</div>
                `;
                    container.appendChild(row);
                });
            }

            window.addEventListener("DOMContentLoaded", loadRankPage);
        </script>
</head>

<body>

    <!-- Hamburger -->
    <div id="hamburgerMenu" class="hamburgerIcon">☰</div>
    <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>

    <!-- Top-right icons -->
    <div id="topRightIcons"></div>

    <!-- Dynamic Menu Loader -->
    <script type="module">
        import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
        import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";
        import {logout} from "./scripts/logout.js";

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
        window.logout = logout;

        async function loadHamburgerMenu() {
            const dropdown = document.getElementById("hamburgerMenuDropdown");
            const isAdmin = localStorage.getItem("isAdmin") === "true";
            const currentPage = window.location.pathname.split("/").pop();

            const {data, error} = await supabase
                .from("menuitems")
                .select("*")
                .eq("hamburger", true)
                .order("hamburgersection", {ascending: true})
                .order("hamburgerorder", {ascending: true});

            if (error) {
                console.error("Menu load error:", error);
                dropdown.innerHTML = "<div class='dropdownItem'>Menu failed to load</div>";
                return;
            }

            let currentSection = null;

            data.forEach(item => {
                if (item.isadmin && !isAdmin) return;
                if (item.url === currentPage) return;

                if (currentSection !== null && item.hamburgersection !== currentSection) {
                    const separator = document.createElement("div");
                    separator.className = "dropdownSeparator";
                    dropdown.appendChild(separator);
                }

                currentSection = item.hamburgersection;

                const div = document.createElement("div");
                div.className = "dropdownItem";
                div.innerText = (item.emoji ? item.emoji + " " : "") + item.displayname;

                div.onclick = () => {
                    if (item.url === "logout") logout();
                    else window.location.href = item.url;
                };

                dropdown.appendChild(div);
            });
        }

        window.addEventListener("DOMContentLoaded", loadHamburgerMenu);

        async function loadTopRightIcons() {
            const container = document.getElementById("topRightIcons");
            const isAdmin = localStorage.getItem("isAdmin") === "true";
            const currentPage = window.location.pathname.split("/").pop();

            const {data, error} = await supabase
                .from("menuitems")
                .select("*")
                .eq("topright", true)
                .order("toprightorder", {ascending: true});

            if (error) {
                console.error("Top-right load error:", error);
                return;
            }

            container.innerHTML = "";

            data.forEach(item => {
                if (item.isadmin && !isAdmin) return;
                if (item.url === currentPage) return;

                const icon = document.createElement("div");
                icon.className = "topRightIcon";
                icon.innerText = item.emoji;

                icon.onclick = () => {
                    if (item.url === "logout") logout();
                    else window.location.href = item.url;
                };

                container.appendChild(icon);
            });
        }

        window.addEventListener("DOMContentLoaded", loadTopRightIcons);
    </script>

    <!-- Hamburger toggle -->
    <script>
        const hamburger = document.getElementById("hamburgerMenu");
        const dropdown = document.getElementById("hamburgerMenuDropdown");

        hamburger.addEventListener("click", () => {
            dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
        });

        document.addEventListener("click", (event) => {
            if (!hamburger.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.style.display = "none";
            }
        });
    </script>

    <div id="profileContainer">
        <h2 id="rankHeading">Rank</h2>
        <div id="rankList"></div>
        <button class="closeBtn" onclick="window.location.href='index.html'">Back</button>
    </div>

</body>

</html>
