<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leagues</title>

    <link rel="stylesheet" href="./mcqcore.css">
    <link rel="stylesheet" href="./rank.css">

    <style>
        /* ------------------------------
           PAGE CONTAINER
        ------------------------------ */
        #profileContainer {
            width: 80%;
            max-width: 600px;
            margin: 120px auto 60px auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        #rankHeading {
            color: #000 !important;
            text-align: center;
            margin-bottom: 24px;
        }

        #rankList {
            margin-top: 20px;
            width: 100%;
        }

        /* ------------------------------
           MODERNISED TOP LEFT MENU
        ------------------------------ */
        #hamburgerMenu {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 30px;
            cursor: pointer;
            z-index: 1000;
            background: #14233d;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
        }

        #hamburgerMenuDropdown {
            position: fixed;
            top: 0;
            left: -260px;
            width: 240px;
            height: 100%;
            background: #1c2f4d;
            padding-top: 80px;
            transition: left 0.3s ease;
            z-index: 999;
            box-shadow: 3px 0 10px rgba(0, 0, 0, 0.3);
        }

        #hamburgerMenuDropdown.open {
            left: 0;
        }

        #hamburgerMenuDropdown a {
            display: block;
            padding: 16px 24px;
            color: white;
            font-size: 20px;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #hamburgerMenuDropdown a:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ------------------------------
           MODERNISED TOP RIGHT ICONS
        ------------------------------ */
        #topRightIcons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 1000;
        }

        .topRightIcon {
            background: #14233d;
            color: white;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-size: 22px;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }

        .topRightIcon:hover {
            background: #007bff;
            transform: scale(1.1);
        }

        /* ------------------------------
           FRIENDS TABLE — EQUAL COLUMNS
        ------------------------------ */
        .rankRow {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
            font-size: 18px;
        }

        .rankPosition {
            font-weight: bold;
            color: #14233d !important;
        }

        .rankNickname {
            font-weight: 500;
        }

        .rankPoints {
            font-weight: bold;
            color: #007bff !important;
        }

        .deleteFriendBtn {
            background: #b33a3a;
            color: #fff;
            border: none;
            padding: 8px 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 60px;
            justify-self: end;
        }

        /* ------------------------------
           TOGGLE SWITCH
        ------------------------------ */
        .toggleContainer {
            text-align: center;
            margin-bottom: 40px;
        }

        .toggleWrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .toggleLabelText {
            font-size: 26px;
            font-weight: bold;
            color: #14233d;
        }

        .toggleLabelText.hidden {
            visibility: hidden;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 22px;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #14233d;
            transition: .4s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #007bff;
        }

        input:checked+.slider:before {
            transform: translateX(28px);
        }

        #friendsSection {
            margin-top: 10px;
            display: none;
        }

        /* ------------------------------
           ADD FRIEND INPUT
        ------------------------------ */
        #addFriendBox {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        #addFriendBox input {
            flex: 1;
            padding: 10px;
            background-color: #d3d3d3;
            border: 1px solid #999;
            border-radius: 6px;
            color: #000;
        }

        #addFriendBox button {
            width: 140px;
            padding: 10px;
        }
    </style>

    <script type="module">
        import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
        import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        /* ------------------------------
           MODERNISED MENUS
        ------------------------------ */
        function buildHamburgerMenu() {
            const menu = document.getElementById("hamburgerMenuDropdown");

            menu.innerHTML = `
                <a href="profile.html">Profile</a>
                <a href="leagues.html">Leagues</a>
                <a href="scores.html">Scores</a>
                <a href="mcqmenu.html">MCQs</a>
            `;

            document.getElementById("hamburgerMenu").onclick = () => {
                menu.classList.toggle("open");
            };

            document.addEventListener("click", (e) => {
                if (!menu.contains(e.target) && e.target.id !== "hamburgerMenu") {
                    menu.classList.remove("open");
                }
            });
        }

        function buildTopRightIcons() {
            const container = document.getElementById("topRightIcons");

            container.innerHTML = `
                <a href="help.html" class="topRightIcon">❓</a>
                <a href="settings.html" class="topRightIcon">⚙️</a>
            `;
        }

        /* ------------------------------
           LEAGUE TABLE
        ------------------------------ */
        async function loadRankPage() {
            const token = localStorage.getItem("sessionToken");
            if (!token) {
                window.location.href = "login.html";
                return;
            }

            const userRank = localStorage.getItem("rank");
            document.getElementById("rankHeading").innerText = `${userRank}`;

            const {data: rankRows} = await supabase
                .from("rank")
                .select("minimum_score, maximum_score")
                .eq("rank", userRank)
                .limit(1);

            const rankData = rankRows?.[0];
            if (!rankData) return;

            const {data: users, error} = await supabase.rpc(
                "get_users_in_rank_range",
                {
                    min_score: rankData.minimum_score,
                    max_score: rankData.maximum_score
                }
            );

            if (error) {
                console.error("RPC error:", error);
                return;
            }

            const container = document.getElementById("rankList");
            container.innerHTML = "";

            users.slice(0, 10).forEach((u, index) => {
                const row = document.createElement("div");
                row.className = "rankRow";
                row.innerHTML = `
                    <div class="rankPosition">${index + 1}</div>
                    <div class="rankNickname">${u.nickname}</div>
                    <div class="rankPoints">${u.scalpel_points}</div>
                    <div></div>
                `;
                container.appendChild(row);
            });
        }

        /* ------------------------------
           FRIENDS SYSTEM
        ------------------------------ */
        async function loadFriends() {
            const userId = parseInt(localStorage.getItem("userId"));

            const {data: friends, error} = await supabase.rpc(
                "get_friends_secure",
                {uid: userId}
            );

            if (error) {
                console.error("Friend RPC error:", error);
                return [];
            }

            return friends;
        }

        /* ------------------------------
           ADD FRIEND (with duplicate check)
        ------------------------------ */
        window.addFriend = async function () {
            const userId = parseInt(localStorage.getItem("userId"));
            const nickname = document.getElementById("friendInput").value.trim();

            if (!nickname) {
                alert("Please enter a nickname.");
                return;
            }

            const {data: users, error} = await supabase.rpc(
                "get_user_by_nickname",
                {nick: nickname}
            );

            if (error) {
                console.error(error);
                alert("Error searching for user.");
                return;
            }

            if (!users || users.length === 0) {
                alert("No user found with that nickname.");
                return;
            }

            const friendId = users[0].id;

            if (friendId === userId) {
                alert("You cannot add yourself.");
                return;
            }

            const {data: existingFriends, error: existingError} = await supabase.rpc(
                "get_friends_secure",
                {uid: userId}
            );

            if (existingError) {
                console.error(existingError);
                alert("Error checking existing friends.");
                return;
            }

            const alreadyFriends = existingFriends.some(f => f.id === friendId);

            if (alreadyFriends) {
                alert("This user is already your friend.");
                return;
            }

            const {error: insertError} = await supabase.rpc(
                "add_friend_secure",
                {uid: userId, fid: friendId}
            );

            if (insertError) {
                console.error(insertError);
                alert("Error adding friend.");
                return;
            }

            renderFriendsList();
        };

        /* ------------------------------
           DELETE FRIEND
        ------------------------------ */
        window.deleteFriend = async function (friendId) {
            const userId = parseInt(localStorage.getItem("userId"));

            const {error} = await supabase.rpc(
                "delete_friend_secure",
                {uid: userId, fid: friendId}
            );

            if (error) {
                console.error("Delete friend RPC error:", error);
                alert("Error removing friend.");
                return;
            }

            renderFriendsList();
        };

        /* ------------------------------
           RENDER FRIENDS TABLE
        ------------------------------ */
        async function renderFriendsList() {
            const container = document.getElementById("rankList");
            container.innerHTML = "";

            const friends = await loadFriends();

            if (!friends.length) {
                container.innerHTML = "<p>No friends added.</p>";
                return;
            }

            friends.forEach((f, index) => {
                const row = document.createElement("div");
                row.className = "rankRow";
                row.innerHTML = `
                    <div class="rankPosition">${index + 1}</div>
                    <div class="rankNickname">${f.nickname}</div>
                    <div class="rankPoints">${f.scalpel_points}</div>
                    <button class="deleteFriendBtn" onclick="deleteFriend(${f.id})">Delete</button>
                `;
                container.appendChild(row);
            });
        }

        /* ------------------------------
           TOGGLE SWITCH
        ------------------------------ */
        window.toggleFriendMode = function () {
            const toggle = document.getElementById("friendToggle");
            const leagueLabel = document.getElementById("leagueLabel");
            const friendsLabel = document.getElementById("friendsLabel");
            const heading = document.getElementById("rankHeading");

            if (toggle.checked) {
                document.getElementById("friendsSection").style.display = "block";
                friendsLabel.classList.remove("hidden");
                leagueLabel.classList.add("hidden");

                heading.innerText = "My Friends";

                renderFriendsList();
            } else {
                document.getElementById("friendsSection").style.display = "none";
                leagueLabel.classList.remove("hidden");
                friendsLabel.classList.add("hidden");

                heading.innerText = localStorage.getItem("rank");

                loadRankPage();
            }
        };

        /* ------------------------------
           PAGE LOAD
        ------------------------------ */
        window.addEventListener("DOMContentLoaded", () => {
            buildHamburgerMenu();
            buildTopRightIcons();
            loadRankPage();
        });
    </script>
</head>

<body>

    <div id="hamburgerMenu">☰</div>
    <div id="hamburgerMenuDropdown"></div>

    <div id="topRightIcons"></div>

    <div id="profileContainer">

        <div class="toggleContainer">
            <div class="toggleWrapper">
                <span id="leagueLabel" class="toggleLabelText">League</span>

                <label class="switch">
                    <input type="checkbox" id="friendToggle" onchange="toggleFriendMode()">
                    <span class="slider"></span>
                </label>

                <span id="friendsLabel" class="toggleLabelText hidden">Friends</span>
            </div>
        </div>

        <h2 id="rankHeading">Leagues</h2>
        <div id="rankList"></div>

        <div id="friendsSection">
            <div id="addFriendBox">
                <input id="friendInput" type="text" placeholder="Enter friend's nickname">
                <button onclick="addFriend()">Add Friend</button>
            </div>
        </div>

    </div>

</body>
