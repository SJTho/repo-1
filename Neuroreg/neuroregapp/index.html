<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroReg</title>

    <!-- Global + Page Styles -->
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/index.css">
    <link rel="apple-touch-icon" href="./icon180.png">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">

</head>

<body>

    <!-- Hamburger -->
    <div id="hamburgerMenu" class="hamburgerIcon">☰</div>
    <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>

    <!-- Top-right icons -->
    <div id="topRightIcons"></div>

    <h1>NeuroReg App</h1>

    <!-- Rank-Up Celebration Banner -->
    <div id="rankUpBanner"></div>

    <!-- Icon Grid -->
    <div id="linksContainer" class="iconGrid"></div>

    <!-- Help Popup -->
    <div id="helpPopup" class="popupOverlay" style="display:none;">
        <div id="helpPopupWindow" class="popupWindow">
            <div id="helpContent"></div>
            <button id="closeHelpBtn" class="closeHelpBtn">Close</button>
        </div>
    </div>

    <!-- Main JS (merged file) -->
    <script type="module" src="./scripts/index.js"></script>

</body>

</html>
