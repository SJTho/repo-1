<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta-name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Theatre</title>

        <link rel="stylesheet" href="./mcqcore.css">
        <link rel="stylesheet" href="./rank.css">

        <style>
            .closeBtn {
                background: #14233d;
                color: white;
                width: 100%;
                margin-top: 20px;
                padding: 10px;
                border-radius: 6px;
                border: none;
                cursor: pointer;
            }

            /* Heading in black */
            #operatingtheatre {
                color: black !important;
                text-align: center;
                margin-bottom: 20px;
            }

            /* Background theatre image */
            #theatreBackground {
                width: 100%;
                border-radius: 10px;
                margin-top: 10px;
            }

            /* Equipment items (draggable) */
            .equipmentItem {
                position: absolute;
                width: 120px;
                cursor: grab;
                user-select: none;
            }
        </style>
</head>

<body>

    <!-- Hamburger Menu -->
    <div id="hamburgerMenu" class="hamburgerIcon">☰</div>

    <div id="hamburgerMenuDropdown" class="dropdownMenu">
        <div class="dropdownItem" onclick="window.location.href='mcqcore.html'">🧠 Test yourself</div>

        <div class="dropdownSeparator"></div>

        <div class="dropdownItem" onclick="window.location.href='index.html'">🏠 Home</div>
        <div class="dropdownItem" onclick="window.location.href='profile.html'">🧑‍⚕️ Profile</div>
        <div class="dropdownItem" onclick="window.location.href='rank.html'">🏅 Rank</div>

        <div class="dropdownSeparator"></div>

        <div class="dropdownItem" onclick="window.location.href='login.html'">🚪 Logout</div>
    </div>

    <!-- Top Right Icons -->
    <div id="topRightIcons">
        <div id="rankIcon" class="topRightIcon" onclick="window.location.href='rank.html'">🏅</div>
        <div id="profileIcon" class="topRightIcon" onclick="window.location.href='profile.html'">🧑‍⚕️</div>
        <div id="helpButton" class="topRightIcon" onclick="window.location.href='help.html'">❔</div>
    </div>

    <!-- Hamburger Script -->
    <script>
        const hamburger = document.getElementById("hamburgerMenu");
        const dropdown = document.getElementById("hamburgerMenuDropdown");

        hamburger.addEventListener("click", () => {
            dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
        });

        document.addEventListener("click", (event) => {
            if (!hamburger.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.style.display = "none";
            }
        });
    </script>

    <!-- Main Container -->
    <div id="profileContainer">
        <h2 id="operatingtheatre">My Theatre</h2>

        <!-- Holding background image -->
        <img id="theatreBackground" src="./images/holdingbackground.png" alt="Operating Theatre Background">

        <!-- Equipment items (examples) -->
        <img class="equipmentItem" src="./images/operatingtable.png" style="top: 300px; left: 200px;">
        <img class="equipmentItem" src="./images/anaestheticmachine.png" style="top: 250px; left: 500px;">
        <img class="equipmentItem" src="./images/ECG.png" style="top: 150px; left: 700px;">
        <img class="equipmentItem" src="./images/imageguidancepart1.png" style="top: 150px; left: 700px;">
        <img class="equipmentItem" src="./images/imageguidancepart2.png" style="top: 150px; left: 700px;">
        <img class="equipmentItem" src="./images/microscope.png" style="top: 150px; left: 700px;">
        <img class="equipmentItem" src="./images/operatinglights.png" style="top: 150px; left: 700px;">


        <button class="closeBtn" onclick="window.location.href='index.html'">Back</button>
    </div>

    <!-- Drag and Drop Script -->
    <script>
        function makeDraggable(el) {
            let offsetX = 0;
            let offsetY = 0;
            let isDragging = false;

            el.addEventListener("mousedown", (e) => {
                isDragging = true;
                offsetX = e.clientX - el.getBoundingClientRect().left;
                offsetY = e.clientY - el.getBoundingClientRect().top;
                el.style.zIndex = 9999;
            });

            document.addEventListener("mousemove", (e) => {
                if (!isDragging) return;
                el.style.left = (e.clientX - offsetX) + "px";
                el.style.top = (e.clientY - offsetY) + "px";
            });

            document.addEventListener("mouseup", () => {
                isDragging = false;
            });
        }

        window.onload = () => {
            document.querySelectorAll(".equipmentItem").forEach(makeDraggable);
        };
    </script>

</body>
