<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Theatre</title>

    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/operatingtheatre.css">

    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>

    <div id="orientationOverlay">
        <div class="orientationMessage">
            🔄 Please rotate your device to landscape when using this section.
        </div>
    </div>

    <!-- Hamburger Menu -->
    <div id="hamburgerMenu" class="hamburgerIcon">☰</div>
    <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>

    <!-- Top Right Icons -->
    <div id="topRightIcons"></div>

    <!-- Main Container -->
    <div id="profileContainer">
        <h2>My Theatre</h2>

        <!-- THEATRE + ROOMS (drag zone) -->
        <div id="theatreAndStore">

            <!-- Theatre wrapper (absolute-position zone) -->
            <div id="theatreWrapper">
                <img id="theatreBackground" src="./images/holdingbackground.png" alt="Operating Theatre Background">

                <!-- Dynamic equipment items injected here -->
                <div id="equipmentContainer"></div>

                <div id="operationsMenuWrapper">
                    <button id="operationsMenuButton">Competencies ▾</button>
                    <div id="operationsDropdown"></div>
                </div>

                <!-- CATEGORY BUTTONS (overlaying the theatre image) -->
                <div id="categoryButtons">
                    <button class="categoryBtn" data-category="room">
                        Room
                        <span class="levelBadge"></span>
                    </button>

                    <button class="categoryBtn" data-category="anaesthetic">
                        Anaesthetic
                        <span class="levelBadge"></span>
                    </button>

                    <button class="categoryBtn" data-category="surgical">
                        Surgical
                        <span class="levelBadge"></span>
                    </button>

                    <button class="categoryBtn" data-category="staff">
                        Staff
                        <span class="levelBadge"></span>
                    </button>
                </div>
            </div>

            <!-- Rooms -->
            <div id="roomsRow">

                <div id="storeroom" class="roomPanel" data-room="storeroom">
                    <h3>Store Room:</h3>
                    <div class="roomEmoji">📦</div>
                </div>

                <div id="staffroom" class="roomPanel" data-room="staffroom">
                    <h3>Staff Room:</h3>
                    <div class="roomEmoji">🧑‍⚕️</div>
                </div>

            </div>

        </div> <!-- END theatreAndStore -->

    </div>

    <script type="module" src="./scripts/operatingtheatre.js"></script>
</body>

</html>
