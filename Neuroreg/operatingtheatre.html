<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Theatre</title>

    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/operatingtheatre.css">
</head>

<body>

    <!-- Hamburger Menu -->
    <div id="hamburgerMenu" class="hamburgerIcon">☰</div>
    <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>

    <!-- Top Right Icons -->
    <div id="topRightIcons"></div>

    <!-- Main Container -->
    <div id="profileContainer">
        <h2>My Theatre</h2>

        <!-- Theatre + Rooms (positioned area) -->
        <div id="theatreAndStore">

            <!-- Theatre wrapper (absolute-position zone) -->
            <div id="theatreWrapper">
                <img id="theatreBackground" src="./images/holdingbackground.png" alt="Operating Theatre Background">

                <!-- Dynamic equipment items injected here -->
                <div id="equipmentContainer"></div>
            </div>

            <!-- Store Room + Staff Room -->
            <div id="roomsRow">

                <div id="storeroom" class="roomPanel" data-room="storeroom">
                    <h3>Store Room:</h3>
                    <div class="roomEmoji">📦</div>
                </div>

                <div id="staffroom" class="roomPanel" data-room="staffroom">
                    <h3>Staff Room:</h3>
                    <div class="roomEmoji">🧑‍⚕️</div>
                </div>

            </div>

        </div>

        <!-- Category Buttons (moved OUTSIDE positioned theatre area) -->
        <div id="categoryButtons">
            <button class="categoryBtn" data-category="room">Room</button>
            <button class="categoryBtn" data-category="anaesthetic">Anaesthetic</button>
            <button class="categoryBtn" data-category="surgical">Surgical</button>
            <button class="categoryBtn" data-category="staff">Staff</button>
        </div>

    </div>

    <script type="module" src="./scripts/operatingtheatre.js"></script>
</body>

</html>
