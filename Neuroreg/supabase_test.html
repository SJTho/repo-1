<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Key Diagnostic</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    pre {
      background: #f4f4f4;
      padding: 10px;
      border-radius: 6px;
    }

    .ok {
      color: green;
      font-weight: bold;
    }

    .fail {
      color: red;
      font-weight: bold;
    }
  </style>

  <script type="module">
    import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://jzdvtqkssamxndgrttct.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6ZHZ0cWtzc2FteG5kZ3J0dGN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNDQ1NzAsImV4cCI6MjEwMTkyMDU3MH0.CHKV56rf8ZSwwKIN0fuzEBuPoxn8qwSW0YzW_1DFcgM";   /* Insert your anon key here */

    const supabase = createClient(supabaseUrl, supabaseKey);

    function print(title, value, ok = true) {
      const out = document.getElementById("output");
      out.innerHTML += `
        <h3>${title} — <span class="${ok ? "ok" : "fail"}">${ok ? "OK" : "FAIL"}</span></h3>
        <pre>${JSON.stringify(value, null, 2)}</pre>
      `;
    }

    async function run() {
      const out = document.getElementById("output");

      // 1. Show raw key status
      const keyPresent = supabaseKey && supabaseKey.length > 0;
      print("Anon key present", {keyPresent}, keyPresent);

      // 2. Show key length
      print("Anon key length", {length: supabaseKey.length}, supabaseKey.length > 20);

      // 3. Show first 10 characters (safe)
      print("Anon key preview", {preview: supabaseKey.substring(0, 10)});

      // 4. Show Supabase headers
      print("Supabase REST headers", supabase.rest.headers, Object.keys(supabase.rest.headers).length > 0);

      // 5. Test actual DB access
      const test = await supabase.from("MCQQuestions").select("*").limit(1);
      print("Supabase DB test", test, !test.error);
    }

    window.onload = run;
  </script>
</head>

<body>
  <h1>Supabase API Key Diagnostic</h1>
  <p>This page checks whether your Supabase anon key is loaded, injected, and accepted.</p>

  <div id="output"></div>
</body>

</html>
