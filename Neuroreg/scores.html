<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Scores</title>

  <!-- Global + Page Styles -->
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/scores.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Logout exposure -->
  <script type="module">
    import {logout} from "./scripts/logout.js";
    window.logout = logout;
  </script>

  <!-- Menu loaders -->
  <script type="module" src="scripts/scores.js"></script>
</head>

<body>

  <div id="hamburgerMenu" class="hamburgerIcon">☰</div>
  <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>

  <div id="topRightIcons"></div>

  <h1>My Scores</h1>

  <div id="mcqArea">

    <p class="chartTitle">Performance over time</p>

    <canvas id="scoreChart"></canvas>

    <h2 class="historyTitle">Score History</h2>

    <table id="scoreTable">
      <thead>
        <tr>
          <th>Date / Time</th>
          <th>Number of Questions</th>
          <th>Score</th>
          <th>Percent</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button id="closeBtn">Back</button>

  </div>

</body>

</html>
