<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scores</title>

  <link rel="stylesheet" href="./mcqcore.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #3b5ca3;
      text-align: center;
    }

    th {
      background: #1f3b6f;
      font-weight: bold;
    }

    .deleteBtn {
      background: #8a2a2a;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      color: #fff;
    }

    .deleteBtn:hover {
      background: #a33b3b;
    }

    .hamburgerIcon {
      font-size: 30px;
      padding: 12px;
      cursor: pointer;
    }

    .dropdownItem {
      font-size: 20px;
      padding: 14px;
      cursor: pointer;
    }

    .dropdownSeparator {
      width: 100%;
      height: 1px;
      background: #ccc;
      margin: 6px 0;
    }

    .topRightIcon {
      font-size: 28px;
      padding: 10px;
      cursor: pointer;
    }
  </style>

  <!-- MUST BE FIRST: GLOBAL LOGOUT IMPORT -->
  <script type="module">
    import {logout} from "./scripts/logout.js";
    window.logout = logout;
  </script>

  <!-- Supabase + menu logic -->
  <script type="module">
    import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
    import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    /* ----------------------------------------------------
       Load Hamburger Menu (admin filtering)
    ---------------------------------------------------- */
    async function loadHamburgerMenu() {
      const dropdown = document.getElementById("hamburgerMenuDropdown");

      const isAdmin = localStorage.getItem("isAdmin") === "true";
      const currentPage = window.location.pathname.split("/").pop();

      const {data, error} = await supabase
        .from("menuitems")
        .select("*")
        .eq("hamburger", true)
        .order("hamburgersection", {ascending: true})
        .order("hamburgerorder", {ascending: true});

      if (error) {
        console.error("Menu load error:", error);
        dropdown.innerHTML = "<div class='dropdownItem'>Menu failed to load</div>";
        return;
      }

      let currentSection = null;

      data.forEach(item => {

        /* ADMIN FILTER */
        if (item.isadmin && !isAdmin) return;

        /* Exclude current page */
        if (item.url === currentPage) return;

        /* Section separator */
        if (currentSection !== null && item.hamburgersection !== currentSection) {
          const separator = document.createElement("div");
          separator.className = "dropdownSeparator";
          dropdown.appendChild(separator);
        }

        currentSection = item.hamburgersection;

        const div = document.createElement("div");
        div.className = "dropdownItem";

        const emoji = item.emoji ? item.emoji + " " : "";
        div.innerText = emoji + item.displayname;

        div.onclick = () => {
          if (item.url === "logout") {
            logout();
          } else {
            window.location.href = item.url;
          }
        };

        dropdown.appendChild(div);
      });
    }

    window.addEventListener("DOMContentLoaded", loadHamburgerMenu);

    /* ----------------------------------------------------
       Load Top-Right Icons (admin filtering)
    ---------------------------------------------------- */
    async function loadTopRightIcons() {
      const container = document.getElementById("topRightIcons");

      const isAdmin = localStorage.getItem("isAdmin") === "true";
      const currentPage = window.location.pathname.split("/").pop();

      const {data, error} = await supabase
        .from("menuitems")
        .select("*")
        .eq("topright", true)
        .order("toprightorder", {ascending: true});

      if (error) {
        console.error("Top-right load error:", error);
        return;
      }

      container.innerHTML = "";

      data.forEach(item => {

        /* ADMIN FILTER */
        if (item.isadmin && !isAdmin) return;

        /* Exclude current page */
        if (item.url === currentPage) return;

        const icon = document.createElement("div");
        icon.className = "topRightIcon";
        icon.innerText = item.emoji;

        icon.onclick = () => {
          if (item.url === "logout") {
            logout();
          } else {
            window.location.href = item.url;
          }
        };

        container.appendChild(icon);
      });
    }

    window.addEventListener("DOMContentLoaded", loadTopRightIcons);
  </script>

</head>

<body>

  <!-- Hamburger -->
  <div id="hamburgerMenu" class="hamburgerIcon">☰</div>
  <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>

  <!-- Top-right icons -->
  <div id="topRightIcons"></div>

  <script>
    const hamburger = document.getElementById("hamburgerMenu");
    const dropdown = document.getElementById("hamburgerMenuDropdown");

    hamburger.addEventListener("click", () => {
      dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", (event) => {
      if (!hamburger.contains(event.target) && !dropdown.contains(event.target)) {
        dropdown.style.display = "none";
      }
    });
  </script>

  <!-- Top-left points + rank -->
  <div id="topLeftInfo">
    <div id="pointsValue" class="tinyText">
      🧑‍⚕️ <span id="pointsNumber"></span>
    </div>
    <div id="rankValue" class="tinyText"></div>
  </div>

  <!-- Top-right help button -->
  <div id="helpButton">❓</div>

  <h1>Your Scores</h1>

  <div id="mcqArea">

    <p style="text-align:center; font-size:1.1rem; margin-bottom:20px;">
      Performance over time
    </p>

    <canvas id="scoreChart" style="width:100%; max-width:600px;"></canvas>

    <h2 style="margin-top:30px; text-align:center;">Score History</h2>

    <table id="scoreTable">
      <thead>
        <tr>
          <th>Date / Time</th>
          <th>Number of Questions</th>
          <th>Score</th>
          <th>Percent</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button id="closeBtn" onclick="window.location.href='index.html'">Back</button>

  </div>

  <script>
    document.getElementById("helpButton").addEventListener("click", () => {
      window.location.href = "help.html";
    });

    function getScalpelPoints() {
      return parseInt(localStorage.getItem("scalpelPoints")) || 0;
    }

    function getRank(points) {
      if (points <= 300) return "Observer";
      if (points <= 600) return "Assistant";
      if (points <= 900) return "Supervised Scrubbed";
      if (points <= 1200) return "Supervised Unscrubbed";
      return "Independent Practice";
    }

    function updateHelpPagePoints() {
      const pts = getScalpelPoints();
      const rank = getRank(pts);

      document.getElementById("pointsNumber").textContent = pts;
      document.getElementById("rankValue").textContent = rank;
    }

    updateHelpPagePoints();

    // Load stored scores
    let stored = localStorage.getItem("scores");
    let scores = stored ? JSON.parse(stored) : [];

    const tableBody = document.querySelector("#scoreTable tbody");

    // Populate table
    scores.forEach((entry, index) => {
      const percent = Math.round((entry.score / entry.total) * 100);

      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${entry.timestamp}</td>
        <td>${entry.total}</td>
        <td>${entry.score}</td>
        <td>${percent}%</td>
        <td><button class="deleteBtn" onclick="deleteScore(${index})">Delete</button></td>
      `;

      tableBody.appendChild(row);
    });

    // Delete score
    function deleteScore(index) {
      if (confirm("Are you sure you want to delete this score?")) {
        scores.splice(index, 1);
        localStorage.setItem("scores", JSON.stringify(scores));
        location.reload();
      }
    }

    // Build graph from remaining scores
    const labels = scores.map(s => s.timestamp);
    const percentages = scores.map(s => Math.round((s.score / s.total) * 100));

    const ctx = document.getElementById('scoreChart').getContext('2d');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Score (%)',
          data: percentages,
          borderColor: '#6fa8ff',
          backgroundColor: 'rgba(111,168,255,0.2)',
          borderWidth: 3,
          tension: 0.3,
          pointRadius: 5,
          pointBackgroundColor: '#2a4c8a',
          pointBorderColor: '#6fa8ff'
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            ticks: {color: '#fff'}
          },
          x: {
            ticks: {color: '#fff', maxRotation: 45, minRotation: 45}
          }
        },
        plugins: {
          legend: {labels: {color: '#fff'}}
        }
      }
    });
  </script>

</body>

</html>
