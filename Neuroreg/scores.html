<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Scores</title>

  <link rel="stylesheet" href="./mcqcore.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #3b5ca3;
      text-align: center;
    }

    th {
      background: #1f3b6f;
      font-weight: bold;
    }

    .deleteBtn {
      background: #8a2a2a;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      color: #fff;
    }

    .deleteBtn:hover {
      background: #a33b3b;
    }

    .hamburgerIcon {
      font-size: 30px;
      padding: 12px;
      cursor: pointer;
    }

    .dropdownItem {
      font-size: 20px;
      padding: 14px;
      cursor: pointer;
    }

    .dropdownSeparator {
      width: 100%;
      height: 1px;
      background: #ccc;
      margin: 6px 0;
    }

    .topRightIcon {
      font-size: 28px;
      padding: 10px;
      cursor: pointer;
    }
  </style>

  <!-- MUST BE FIRST: GLOBAL LOGOUT IMPORT -->
  <script type="module">
    import {logout} from "./scripts/logout.js";
    window.logout = logout;
  </script>

  <!-- Supabase + menu logic -->
  <script type="module">
    import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
    import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadHamburgerMenu() {
      const dropdown = document.getElementById("hamburgerMenuDropdown");
      const isAdmin = localStorage.getItem("isAdmin") === "true";
      const currentPage = window.location.pathname.split("/").pop();

      const {data, error} = await supabase
        .from("menuitems")
        .select("*")
        .eq("hamburger", true)
        .order("hamburgersection", {ascending: true})
        .order("hamburgerorder", {ascending: true});

      if (error) {
        console.error("Menu load error:", error);
        dropdown.innerHTML = "<div class='dropdownItem'>Menu failed to load</div>";
        return;
      }

      let currentSection = null;

      data.forEach(item => {
        if (item.isadmin && !isAdmin) return;
        if (item.url === currentPage) return;

        if (currentSection !== null && item.hamburgersection !== currentSection) {
          const separator = document.createElement("div");
          separator.className = "dropdownSeparator";
          dropdown.appendChild(separator);
        }

        currentSection = item.hamburgersection;

        const div = document.createElement("div");
        div.className = "dropdownItem";

        const emoji = item.emoji ? item.emoji + " " : "";
        div.innerText = emoji + item.displayname;

        div.onclick = () => {
          if (item.url === "logout") logout();
          else window.location.href = item.url;
        };

        dropdown.appendChild(div);
      });
    }

    window.addEventListener("DOMContentLoaded", loadHamburgerMenu);

    async function loadTopRightIcons() {
      const container = document.getElementById("topRightIcons");
      const isAdmin = localStorage.getItem("isAdmin") === "true";
      const currentPage = window.location.pathname.split("/").pop();

      const {data, error} = await supabase
        .from("menuitems")
        .select("*")
        .eq("topright", true)
        .order("toprightorder", {ascending: true});

      if (error) {
        console.error("Top-right load error:", error);
        return;
      }

      container.innerHTML = "";

      data.forEach(item => {
        if (item.isadmin && !isAdmin) return;
        if (item.url === currentPage) return;

        const icon = document.createElement("div");
        icon.className = "topRightIcon";
        icon.innerText = item.emoji;

        icon.onclick = () => {
          if (item.url === "logout") logout();
          else window.location.href = item.url;
        };

        container.appendChild(icon);
      });
    }

    window.addEventListener("DOMContentLoaded", loadTopRightIcons);
  </script>

</head>

<body>

  <!-- Hamburger -->
  <div id="hamburgerMenu" class="hamburgerIcon">☰</div>
  <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>

  <!-- Top-right icons -->
  <div id="topRightIcons"></div>

  <script>
    const hamburger = document.getElementById("hamburgerMenu");
    const dropdown = document.getElementById("hamburgerMenuDropdown");

    hamburger.addEventListener("click", () => {
      dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", (event) => {
      if (!hamburger.contains(event.target) && !dropdown.contains(event.target)) {
        dropdown.style.display = "none";
      }
    });
  </script>

  <h1>My Scores</h1>

  <div id="mcqArea">

    <canvas id="scoreChart" style="width:100%; max-width:600px;"></canvas>

    <h2 style="margin-top:30px; text-align:center;">Score History</h2>

    <table id="scoreTable">
      <thead>
        <tr>
          <th>Date / Time</th>
          <th>Number of Questions</th>
          <th>Score</th>
          <th>Percent</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button id="closeBtn" onclick="window.location.href='index.html'">Back</button>

  </div>

  <script type="module">
    import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
    import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const userId = parseInt(localStorage.getItem("userId"));

    function formatTimestamp(ts) {
      const d = new Date(ts);
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const yy = String(d.getFullYear()).slice(-2);
      const hh = String(d.getHours()).padStart(2, "0");
      const min = String(d.getMinutes()).padStart(2, "0");
      return `${dd}/${mm}/${yy} ${hh}:${min}`;
    }

    async function loadScores() {
      const {data: scores, error} = await supabase
        .from("userpracticemcqscores")
        .select("*")
        .eq("userid", userId)
        .order("created_at", {ascending: true});

      if (error) {
        console.error("Error loading scores:", error);
        return;
      }

      const tableBody = document.querySelector("#scoreTable tbody");

      scores.forEach(entry => {
        const percent = Math.round((entry.score / entry.numberofquestions) * 100);

        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${formatTimestamp(entry.created_at)}</td>
          <td>${entry.numberofquestions}</td>
          <td>${entry.score}</td>
          <td>${percent}%</td>
          <td><button class="deleteBtn" onclick="deleteScore(${entry.id})">Delete</button></td>
        `;

        tableBody.appendChild(row);
      });

      buildChart(scores);
    }

    async function deleteScore(id) {
      if (!confirm("Are you sure you want to delete this score?")) return;

      const {error} = await supabase
        .from("userpracticemcqscores")
        .delete()
        .eq("id", id);

      if (error) {
        alert("Failed to delete score: " + error.message);
        return;
      }

      location.reload();
    }

    function buildChart(scores) {
      const labels = scores.map(s => formatTimestamp(s.created_at));
      const percentages = scores.map(s => Math.round((s.score / s.numberofquestions) * 100));

      const ctx = document.getElementById('scoreChart').getContext('2d');

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Score (%)',
            data: percentages,
            borderColor: '#6fa8ff',
            backgroundColor: 'rgba(111,168,255,0.2)',
            borderWidth: 3,
            tension: 0.3,
            pointRadius: 5,
            pointBackgroundColor: '#2a4c8a',
            pointBorderColor: '#6fa8ff'
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true,
              max: 100,
              ticks: {color: '#fff'}
            },
            x: {
              ticks: {color: '#fff', maxRotation: 45, minRotation: 45}
            }
          },
          plugins: {
            legend: {labels: {color: '#fff'}}
          }
        }
      });
    }

    loadScores();
  </script>

</body>

</html>
