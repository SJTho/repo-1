<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leagues</title>

    <link rel="stylesheet" href="./mcqcore.css">
    <link rel="stylesheet" href="./leagues.css">

    <style>
        #profileContainer {
            width: 80%;
            max-width: 600px;
            margin: 120px auto 60px auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        #rankHeading {
            color: #000 !important;
            text-align: center;
            margin-bottom: 24px;
        }

        #rankList {
            margin-top: 20px;
            width: 100%;
        }

        .rankRow {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
            font-size: 18px;
        }

        .rankPosition {
            font-weight: bold;
            color: #14233d !important;
        }

        .rankNickname {
            font-weight: 500;
        }

        .rankPoints {
            font-weight: bold;
            color: #007bff !important;
        }

        .deleteFriendBtn {
            background: #b33a3a;
            color: #fff;
            border: none;
            padding: 8px 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 60px;
            justify-self: end;
        }

        .toggleContainer {
            text-align: center;
            margin-bottom: 40px;
        }

        .toggleWrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .toggleLabelText {
            font-size: 26px;
            font-weight: bold;
            color: #14233d;
        }

        .toggleLabelText.hidden {
            visibility: hidden;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 22px;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #14233d;
            transition: .4s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #007bff;
        }

        input:checked+.slider:before {
            transform: translateX(28px);
        }

        #friendsSection {
            margin-top: 10px;
            display: none;
        }

        #addFriendBox {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        #addFriendBox input {
            flex: 1;
            padding: 10px;
            background-color: #d3d3d3;
            border: 1px solid #999;
            border-radius: 6px;
            color: #000;
        }

        #addFriendBox button {
            width: 140px;
            padding: 10px;
        }

        .rankNickname {
            color: #000 !important;
        }

        .rankRow div {
            color: #000 !important;
        }
    </style>

    <!-- MUST BE FIRST: GLOBAL LOGOUT IMPORT -->
    <script type="module">
        import {logout} from "./scripts/logout.js";
        window.logout = logout;
    </script>

    <!-- Supabase + menu logic -->
    <script type="module">
        import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
        import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        /* ----------------------------------------------------
           Hamburger Menu (same as profile.html)
        ---------------------------------------------------- */
        async function loadHamburgerMenu() {
            const dropdown = document.getElementById("hamburgerMenuDropdown");
            const isAdmin = localStorage.getItem("isAdmin") === "true";
            const currentPage = window.location.pathname.split("/").pop();

            const {data, error} = await supabase
                .from("menuitems")
                .select("*")
                .eq("hamburger", true)
                .order("hamburgersection", {ascending: true})
                .order("hamburgerorder", {ascending: true});

            if (error) {
                dropdown.innerHTML = "<div class='dropdownItem'>Menu failed to load</div>";
                return;
            }

            let currentSection = null;

            data.forEach(item => {
                if (item.admin && !isAdmin) return;
                if (item.url === currentPage) return;

                if (currentSection !== null && item.hamburgersection !== currentSection) {
                    const separator = document.createElement("div");
                    separator.className = "dropdownSeparator";
                    dropdown.appendChild(separator);
                }

                currentSection = item.hamburgersection;

                const div = document.createElement("div");
                div.className = "dropdownItem";

                const emoji = item.emoji ? item.emoji + " " : "";
                div.innerText = emoji + item.displayname;

                div.onclick = () => {
                    if (item.url === "logout") logout();
                    else window.location.href = item.url;
                };

                dropdown.appendChild(div);
            });
        }

        /* ----------------------------------------------------
           Top-Right Icons (same as profile.html)
        ---------------------------------------------------- */
        async function loadTopRightIcons() {
            const container = document.getElementById("topRightIcons");
            const isAdmin = localStorage.getItem("isAdmin") === "true";
            const currentPage = window.location.pathname.split("/").pop();

            const {data, error} = await supabase
                .from("menuitems")
                .select("*")
                .eq("topright", true)
                .order("toprightorder", {ascending: true});

            if (error) return;

            container.innerHTML = "";

            data.forEach(item => {
                if (item.admin && !isAdmin) return;
                if (item.url === currentPage) return;

                const icon = document.createElement("div");
                icon.className = "topRightIcon";
                icon.innerText = item.emoji;

                icon.onclick = () => {
                    if (item.url === "logout") logout();
                    else window.location.href = item.url;
                };

                container.appendChild(icon);
            });
        }

        /* ----------------------------------------------------
           Rank Page (LOCALSTORAGE, same as profile.html)
        ---------------------------------------------------- */
        async function loadRankPage() {
            const token = localStorage.getItem("sessionToken");
            if (!token) {
                window.location.href = "login.html";
                return;
            }

            const userRank = localStorage.getItem("rank") ?? "Unranked";
            document.getElementById("rankHeading").innerText = userRank;

            const {data: rankRows} = await supabase
                .from("rank")
                .select("minimum_score, maximum_score")
                .eq("rank", userRank)
                .limit(1);

            const rankData = rankRows?.[0];
            if (!rankData) return;

            const {data: users, error} = await supabase.rpc(
                "get_users_in_rank_range",
                {
                    min_score: rankData.minimum_score,
                    max_score: rankData.maximum_score
                }
            );

            if (error) return;

            const container = document.getElementById("rankList");
            container.innerHTML = "";

            users.slice(0, 10).forEach((u, index) => {
                const row = document.createElement("div");
                row.className = "rankRow";
                row.innerHTML = `
                    <div class="rankPosition">${index + 1}</div>
                    <div class="rankNickname">${u.nickname}</div>
                    <div class="rankPoints">${u.scalpel_points}</div>
                    <div></div>
                `;
                container.appendChild(row);
            });
        }

        /* ----------------------------------------------------
           Friends Logic (unchanged)
        ---------------------------------------------------- */
        async function loadFriends() {
            const userId = parseInt(localStorage.getItem("userId"));

            const {data: friends} = await supabase.rpc(
                "get_friends_secure",
                {uid: userId}
            );

            return friends ?? [];
        }

        window.addFriend = async function () {
            const userId = parseInt(localStorage.getItem("userId"));
            const nickname = document.getElementById("friendInput").value.trim();

            if (!nickname) {
                alert("Please enter a nickname.");
                return;
            }

            const {data: users} = await supabase.rpc(
                "get_user_by_nickname",
                {nick: nickname}
            );

            if (!users || users.length === 0) {
                alert("No user found with that nickname.");
                return;
            }

            const friendId = users[0].id;

            if (friendId === userId) {
                alert("You cannot add yourself.");
                return;
            }

            const existingFriends = await loadFriends();
            const alreadyFriends = existingFriends.some(f => f.id === friendId);

            if (alreadyFriends) {
                alert("This user is already your friend.");
                return;
            }

            await supabase.rpc("add_friend_secure", {
                uid: userId,
                fid: friendId
            });

            renderFriendsList();
        };

        window.deleteFriend = async function (friendId) {
            const userId = parseInt(localStorage.getItem("userId"));

            await supabase.rpc("delete_friend_secure", {
                uid: userId,
                fid: friendId
            });

            renderFriendsList();
        };

        async function renderFriendsList() {
            const container = document.getElementById("rankList");
            container.innerHTML = "";

            const friends = await loadFriends();

            if (!friends.length) {
                container.innerHTML = "<p>No friends added.</p>";
                return;
            }

            friends.forEach((f, index) => {
                const row = document.createElement("div");
                row.className = "rankRow";
                row.innerHTML = `
                    <div class="rankPosition">${index + 1}</div>
                    <div class="rankNickname">${f.nickname}</div>
                    <div class="rankPoints">${f.scalpel_points}</div>
                    <button class="deleteFriendBtn" onclick="deleteFriend(${f.id})">Delete</button>
                `;
                container.appendChild(row);
            });
        }

        window.toggleFriendMode = function () {
            const toggle = document.getElementById("friendToggle");
            const leagueLabel = document.getElementById("leagueLabel");
            const friendsLabel = document.getElementById("friendsLabel");
            const heading = document.getElementById("rankHeading");

            if (toggle.checked) {
                document.getElementById("friendsSection").style.display = "block";
                friendsLabel.classList.remove("hidden");
                leagueLabel.classList.add("hidden");

                heading.innerText = "My Friends";

                renderFriendsList();
            } else {
                document.getElementById("friendsSection").style.display = "none";
                leagueLabel.classList.remove("hidden");
                friendsLabel.classList.add("hidden");

                heading.innerText = localStorage.getItem("rank");

                loadRankPage();
            }
        };

        /* ----------------------------------------------------
           Page Load
        ---------------------------------------------------- */
        window.addEventListener("DOMContentLoaded", loadHamburgerMenu);
        window.addEventListener("DOMContentLoaded", loadTopRightIcons);
        window.addEventListener("DOMContentLoaded", loadRankPage);
    </script>
</head>

<body>

    <div id="hamburgerMenu" class="hamburgerIcon">☰</div>
    <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>

    <div id="topRightIcons"></div>

    <script>
        const hamburger = document.getElementById("hamburgerMenu");
        const dropdown = document.getElementById("hamburgerMenuDropdown");

        hamburger.addEventListener("click", () => {
            dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
        });

        document.addEventListener("click", (event) => {
            if (!hamburger.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.style.display = "none";
            }
        });
    </script>

    <div id="profileContainer">

        <div class="toggleContainer">
            <div class="toggleWrapper">
                <span id="leagueLabel" class="toggleLabelText">Leagues</span>

                <label class="switch">
                    <input type="checkbox" id="friendToggle" onchange="toggleFriendMode()">
                    <span class="slider"></span>
                </label>

                <span id="friendsLabel" class="toggleLabelText hidden">Friends</span>
            </div>
        </div>

        <h2 id="rankHeading">Leagues</h2>
        <div id="rankList"></div>

        <div id="friendsSection">
            <div id="addFriendBox">
                <input id="friendInput" type="text" placeholder="Enter friend's nickname">
                <button onclick="addFriend()">Add Friend</button>
            </div>
        </div>

    </div>

</body>

</html>
