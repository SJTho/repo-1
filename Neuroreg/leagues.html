<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leagues</title>

    <!-- Updated CSS references -->
    <link rel="stylesheet" href="./styles/global1.css">
    <link rel="stylesheet" href="./styles/leagues.css">

    <!-- MUST BE FIRST: GLOBAL LOGOUT IMPORT -->
    <script type="module">
        import {logout} from "./scripts/logout.js";
        window.logout = logout;
    </script>

    <!-- Leagues JS -->
    <script type="module" src="./scripts/leagues.js"></script>
</head>

<body>

    <div id="hamburgerMenu" class="hamburgerIcon">☰</div>
    <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>

    <div id="topRightIcons"></div>

    <script>
        const hamburger = document.getElementById("hamburgerMenu");
        const dropdown = document.getElementById("hamburgerMenuDropdown");

        hamburger.addEventListener("click", () => {
            dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
        });

        document.addEventListener("click", (event) => {
            if (!hamburger.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.style.display = "none";
            }
        });
    </script>

    <div id="profileContainer">

        <div class="toggleContainer">
            <div class="toggleWrapper">
                <span id="leagueLabel" class="toggleLabelText">Leagues</span>

                <label class="switch">
                    <input type="checkbox" id="friendToggle" onchange="toggleFriendMode()">
                    <span class="slider"></span>
                </label>

                <span id="friendsLabel" class="toggleLabelText hidden">Friends</span>
            </div>
        </div>

        <h2 id="rankHeading">Leagues</h2>
        <div id="rankList"></div>

        <div id="friendsSection">
            <div id="addFriendBox">
                <input id="friendInput" type="text" placeholder="Enter friend's nickname">
                <button onclick="addFriend()">Add Friend</button>
            </div>
        </div>

    </div>

</body>

</html>
