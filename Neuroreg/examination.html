<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta-name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination</title>

    <link rel="stylesheet" href="mcqcore.css">

    <style>
      #topRightClock {
        position: fixed;
        top: 10px;
        right: 10px;
        font-size: 1.6rem;
        font-weight: bold;
        background: transparent;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
        z-index: 999;
      }
    </style>
</head>

<body>

  <!-- LOGIN REDIRECT -->
  <script>
    const sessionToken = localStorage.getItem("sessionToken");
    if (!sessionToken) {
      window.location.href = "login.html";
    }
  </script>

  <!-- Top-left hamburger -->
  <div id="hamburgerMenu" class="hamburgerIcon">☰</div>

  <!-- Dropdown Menu -->
  <div id="hamburgerMenuDropdown" class="dropdownMenu">
    <div class="dropdownItem" onclick="window.location.href='mcqcore.html'">🧠 Test yourself</div>

    <div class="dropdownSeparator"></div>

    <div class="dropdownItem" onclick="window.location.href='index.html'">🏠 Home</div>
    <div class="dropdownItem" onclick="window.location.href='profile.html'">🧑‍⚕️ Profile</div>
    <div class="dropdownItem" onclick="window.location.href='rank.html'">🏅 Rank</div>

    <div class="dropdownSeparator"></div>

    <div class="dropdownItem" onclick="window.location.href='login.html'">🚪 Logout</div>
  </div>

  <!-- Top-right countdown clock -->
  <div id="topRightClock">03:00:00</div>

  <script>
    /* Dropdown toggle */
    const hamburger = document.getElementById("hamburgerMenu");
    const dropdown = document.getElementById("hamburgerMenuDropdown");

    hamburger.addEventListener("click", () => {
      dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", (event) => {
      if (!hamburger.contains(event.target) && !dropdown.contains(event.target)) {
        dropdown.style.display = "none";
      }
    });
  </script>

  <!-- Event Title Heading -->
  <h1 id="combinedHeading"></h1>

  <div class="card">
    <h2>Page under development</h2>
  </div>

  <!-- Buttons -->
  <div id="buttonRow">
    <button id="closeBtn" class="actionBtn">Back</button>
  </div>

  <script>
    /* EVENT TITLE HEADING */
    const storedTitle = localStorage.getItem("currentEventTitle");
    document.getElementById("combinedHeading").textContent = storedTitle;

    /* COUNTDOWN CLOCK (3 hours) */
    let remainingSeconds = 3 * 60 * 60; // 3 hours

    function updateClock() {
      const hours = String(Math.floor(remainingSeconds / 3600)).padStart(2, "0");
      const minutes = String(Math.floor((remainingSeconds % 3600) / 60)).padStart(2, "0");
      const seconds = String(remainingSeconds % 60).padStart(2, "0");

      document.getElementById("topRightClock").textContent = `${hours}:${minutes}:${seconds}`;

      if (remainingSeconds > 0) {
        remainingSeconds--;
      }
    }

    updateClock(); // initial draw
    setInterval(updateClock, 1000); // update every second

    /* BACK BUTTON */
    document.getElementById("closeBtn").addEventListener("click", () => {
      window.history.back();
    });
  </script>

</body>

</html>
