<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta-name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination</title>

    <link rel="stylesheet" href="mcqcore.css">

    <style>
      /* Top-right countdown clock */
      #topRightClock {
        position: fixed;
        top: 10px;
        right: 10px;
        font-size: 1.6rem;
        font-weight: bold;
        background: transparent;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
        z-index: 999;
      }
    </style>
</head>

<body>

  <!-- LOGIN + SERVER-SIDE EXAM ACCESS CHECK -->
  <script type="module">
    import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
    import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const sessionToken = localStorage.getItem("sessionToken");
    const userId = parseInt(localStorage.getItem("userId"));
    const eventId = parseInt(localStorage.getItem("currentEventId"));

    // Must be logged in
    if (!sessionToken) {
      window.location.href = "login.html";
    }

    // Server-side enforcement:
    // ✅ examstarted === true  -> BLOCK access
    // ✅ examstarted === false -> ALLOW access
    async function checkServerLock() {
      const {data, error} = await supabase
        .from("eventregistration")
        .select("examstarted")
        .eq("userid", userId)
        .eq("eventid", eventId)
        .maybeSingle();

      // Block if:
      // - error
      // - no row
      // - examstarted is true (already used this exam)
      if (error || !data || data.examstarted === true) {
        window.location.href = "formaltestinstructions.html";
      }
      // If examstarted === false, user stays on examination.html
    }

    checkServerLock();
  </script>

  <!-- Top-left hamburger -->
  <div id="hamburgerMenu" class="hamburgerIcon">☰</div>

  <!-- Dropdown Menu -->
  <div id="hamburgerMenuDropdown" class="dropdownMenu">
    <div class="dropdownItem" data-target="mcqcore.html">🧠 Test yourself</div>

    <div class="dropdownSeparator"></div>

    <div class="dropdownItem" data-target="index.html">🏠 Home</div>
    <div class="dropdownItem" data-target="profile.html">🧑‍⚕️ Profile</div>
    <div class="dropdownItem" data-target="rank.html">🏅 Rank</div>

    <div class="dropdownSeparator"></div>

    <div class="dropdownItem" data-target="login.html">🚪 Logout</div>
  </div>

  <!-- Top-right countdown clock -->
  <div id="topRightClock">03:00:00</div>

  <script>
    /* Dropdown toggle */
    const hamburger = document.getElementById("hamburgerMenu");
    const dropdown = document.getElementById("hamburgerMenuDropdown");

    hamburger.addEventListener("click", () => {
      dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", (event) => {
      if (!hamburger.contains(event.target) && !dropdown.contains(event.target)) {
        dropdown.style.display = "none";
      }
    });

    /* Exit warning */
    function confirmExitExam() {
      return confirm(
        "If you leave this page you will NOT be allowed back into the examination.\n\nDo you want to continue?"
      );
    }

    /* Apply exit warning to hamburger links */
    document.querySelectorAll("#hamburgerMenuDropdown .dropdownItem")
      .forEach(item => {
        item.addEventListener("click", () => {
          const target = item.dataset.target;
          if (confirmExitExam()) {
            window.location.href = target;
          }
        });
      });
  </script>

  <!-- Event Title Heading -->
  <h1 id="combinedHeading"></h1>

  <div class="card">
    <h2>Page under development</h2>
  </div>

  <!-- Buttons -->
  <div id="buttonRow">
    <button id="closeBtn" class="actionBtn">Back</button>
  </div>

  <script>
    /* EVENT TITLE HEADING */
    const storedTitle = localStorage.getItem("currentEventTitle");
    document.getElementById("combinedHeading").textContent = storedTitle;

    /* COUNTDOWN CLOCK (3 hours) */
    let remainingSeconds = 3 * 60 * 60; // 3 hours

    function updateClock() {
      const hours = String(Math.floor(remainingSeconds / 3600)).padStart(2, "0");
      const minutes = String(Math.floor((remainingSeconds % 3600) / 60)).padStart(2, "0");
      const seconds = String(remainingSeconds % 60).padStart(2, "0");

      document.getElementById("topRightClock").textContent = `${hours}:${minutes}:${seconds}`;

      if (remainingSeconds > 0) {
        remainingSeconds--;
      }
      // When it hits zero, do nothing (for now)
    }

    updateClock();                 // initial draw
    setInterval(updateClock, 1000); // update every second

    /* BACK BUTTON with exit warning */
    document.getElementById("closeBtn").addEventListener("click", () => {
      if (confirmExitExam()) {
        window.history.back();
      }
    });
  </script>

</body>
