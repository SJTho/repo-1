<script type="module">
  import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
  import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const sessionToken = localStorage.getItem("sessionToken");
  const userId = parseInt(localStorage.getItem("userId"));
  const eventId = parseInt(localStorage.getItem("currentEventId"));

  if (!sessionToken) {
    window.location.href = "login.html";
  }

  async function checkAccess() {
    const {data, error} = await supabase
      .from("eventregistration")
      .select("examstarted")
      .eq("userid", userId)
      .eq("eventid", eventId)
      .maybeSingle();

    if (error || !data) {
      window.location.href = "formaltestinstructions.html";
      return false;
    }

    if (data.examstarted === true) {
      window.location.href = "formaltestinstructions.html";
      return false;
    }

    return true;
  }

  async function lockExam() {
    await supabase
      .from("eventregistration")
      .update({examstarted: true})
      .eq("userid", userId)
      .eq("eventid", eventId);
  }

  (async () => {
    const allowed = await checkAccess();
    if (!allowed) return;

    // Trigger exam lock 5 seconds after DOM is ready
    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        lockExam();
      }, 5000); // 5 seconds
    });

    // Backup trigger at 7 seconds
    setTimeout(() => {
      lockExam();
    }, 7000);
  })();
</script>
