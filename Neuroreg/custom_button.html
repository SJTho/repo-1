<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Custom Link</title>

    <link rel="stylesheet" href="./styles/global.css">
</head>

<body>
    <h1>Add Custom Link</h1>

    <div id="customLinksArea" class="panel" style="max-width:400px; margin:30px auto;">
        <label>Button Name</label>
        <input id="customName" type="text" placeholder="e.g. My Trust Portal">

        <label>Target URL</label>
        <input id="customURL" type="text" placeholder="e.g. www.myhospital.nhs.uk">

        <label>Optional Icon Image</label>
        <input id="customImage" type="file" accept="image/*">

        <button id="saveBtn">Save Link</button>
        <button id="backBtn" style="margin-top:15px; background:#8a2a2a;">Close</button>
    </div>

    <script>
        function loadCustomButtons() {
            const saved = JSON.parse(localStorage.getItem("customButtons") || "[]");
            return saved.slice(0, 3); // max 3
        }

        function saveCustomButtons(buttons) {
            localStorage.setItem("customButtons", JSON.stringify(buttons));
        }

        const saveBtn = document.getElementById("saveBtn");
        const backBtn = document.getElementById("backBtn");

        saveBtn.addEventListener("click", () => {
            const name = document.getElementById("customName").value.trim();
            let url = document.getElementById("customURL").value.trim();
            const imgInput = document.getElementById("customImage");

            if (!name || !url) {
                alert("Name and URL are required.");
                return;
            }

            // Auto-add https:// if missing
            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = "https://" + url;
            }

            const buttons = loadCustomButtons();
            if (buttons.length >= 3) {
                alert("You already have 3 custom links. Delete one before adding another.");
                return;
            }

            let imageData = null;

            if (imgInput.files && imgInput.files[0]) {
                const reader = new FileReader();
                reader.onload = () => {
                    imageData = reader.result;

                    buttons.push({name, url, image: imageData});
                    saveCustomButtons(buttons);

                    window.location.href = "index.html";
                };
                reader.readAsDataURL(imgInput.files[0]);
            } else {
                buttons.push({name, url, image: null});
                saveCustomButtons(buttons);

                window.location.href = "index.html";
            }
        });

        backBtn.addEventListener("click", () => {
            window.location.href = "index.html";
        });
    </script>

</body>

</html>
