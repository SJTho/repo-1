<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuroreg</title>

    <!-- Updated stylesheet reference -->
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/index.css">
</head>

<body>

    <!-- Hamburger -->
    <div id="hamburgerMenu" class="hamburgerIcon">☰</div>
    <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>

    <!-- Top-right icons -->
    <div id="topRightIcons"></div>

    <h1>NeuroReg App</h1>

    <!-- Rank-Up Celebration Banner -->

            <button id="cancelDelete">Cancel</button>
