<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice MCQs</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="./styles/global.css">

  <!-- Page-specific styles -->
  <link rel="stylesheet" href="./styles/mcqcore.css">

  <!-- Supabase client -->
  <script type="module">
    import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
    import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

    window.supabaseUrl = SUPABASE_URL;
    window.supabaseKey = SUPABASE_KEY;
    window.supabase = createClient(window.supabaseUrl, window.supabaseKey);

    window.fetchQuestionsFromDB = async () => {
      const {data, error} = await window.supabase
        .from("mcqquestions")
        .select("*");

      if (error) {
        console.error("Supabase fetch error:", error);
        alert("Error loading questions from database.");
        return [];
      }

      return data;
    };
  </script>
</head>

<body>

  <!-- Hamburger -->
  <div id="hamburgerMenu" class="hamburgerIcon">☰</div>
  <div id="hamburgerMenuDropdown" class="dropdownMenu"></div>

  <!-- Top-right icons -->
  <div id="topRightIcons"></div>

  <!-- Menu loader -->
  <script type="module">
    import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
    import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";
    import {logout} from "./scripts/logout.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    window.logout = logout;

    async function loadHamburgerMenu() {
      const dropdown = document.getElementById("hamburgerMenuDropdown");
      const isAdmin = localStorage.getItem("isAdmin") === "true";
      const currentPage = window.location.pathname.split("/").pop();

      const {data, error} = await supabase
        .from("menuitems")
        .select("*")
        .eq("hamburger", true)
        .order("hamburgersection", {ascending: true})
        .order("hamburgerorder", {ascending: true});

      if (error) {
        dropdown.innerHTML = "<div class='dropdownItem'>Menu failed to load</div>";
        return;
      }

      let currentSection = null;

      data.forEach(item => {
        if (item.admin && !isAdmin) return;
        if (item.url === currentPage) return;

        if (currentSection !== null && item.hamburgersection !== currentSection) {
          const separator = document.createElement("div");
          separator.className = "dropdownSeparator";
          dropdown.appendChild(separator);
        }

        currentSection = item.hamburgersection;

        const div = document.createElement("div");
        div.className = "dropdownItem";
        div.innerText = (item.emoji ? item.emoji + " " : "") + item.displayname;

        div.onclick = () => {
          if (item.url === "logout") logout();
          else window.location.href = item.url;
        };

        dropdown.appendChild(div);
      });
    }

    async function loadTopRightIcons() {
      const container = document.getElementById("topRightIcons");
      const isAdmin = localStorage.getItem("isAdmin") === "true";
      const currentPage = window.location.pathname.split("/").pop();

      const {data, error} = await supabase
        .from("menuitems")
        .select("*")
        .eq("topright", true)
        .order("toprightorder", {ascending: true});

      if (error) return;

      container.innerHTML = "";

      data.forEach(item => {
        if (item.admin && !isAdmin) return;
        if (item.url === currentPage) return;

        const icon = document.createElement("div");
        icon.className = "topRightIcon";
        icon.innerText = item.emoji;

        icon.onclick = () => {
          if (item.url === "logout") logout();
          else window.location.href = item.url;
        };

        container.appendChild(icon);
      });
    }

    window.addEventListener("DOMContentLoaded", loadHamburgerMenu);
    window.addEventListener("DOMContentLoaded", loadTopRightIcons);
  </script>

  <!-- Hamburger toggle -->
  <script>
    const hamburger = document.getElementById("hamburgerMenu");
    const dropdown = document.getElementById("hamburgerMenuDropdown");

    hamburger.addEventListener("click", () => {
      dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", (event) => {
      if (!hamburger.contains(event.target) && !dropdown.contains(event.target)) {
        dropdown.style.display = "none";
      }
    });
  </script>

  <!-- MCQ PAGE WRAPPER -->
  <div id="mcqCorePage">

    <h1>Practice MCQs</h1>

    <div id="mcqSetup">
      <label for="mcqCount">How many questions?</label>
      <input type="number" id="mcqCount" min="1" value="20">

      <label for="mcqAreas">Which subspecialty?</label>
      <select id="mcqAreas">
        <option value="all">All</option>
        <option value="Vascular">Vascular</option>
        <option value="Oncology">Oncology</option>
        <option value="Skull Base">Skull base</option>
        <option value="Trauma">Trauma</option>
        <option value="CSF">CSF</option>
        <option value="Spine">Spine</option>
        <option value="Paediatrics">Paediatrics</option>
        <option value="Peripheral Nerve">Peripheral Nerve</option>
        <option value="Functional">Functional & Pain</option>
        <option value="Epilepsy">Epilepsy</option>
      </select>

      <label for="mcqLevel">Level</label>
      <select id="mcqLevel">
        <option value="all">All</option>
        <option value="MRCS">MRCS</option>
        <option value="FRCS">FRCS</option>
      </select>

      <button id="startSubmitBtn">Submit</button>
    </div>

    <div id="mcqquestions"></div>
    <div id="scoreDisplay"></div>

    <button id="closeBtn" onclick="window.location.href='index.html'">Close</button>

  </div>

  <!-- Page logic -->
  <script src="./scripts/mcqcore.js"></script>

</body>

</html>
