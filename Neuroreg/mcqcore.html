<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice MCQs</title>

  <link rel="stylesheet" href="./mcqcore.css">

  <!-- Supabase client -->
  <script type="module">

    import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
    import {SUPABASE_URL, SUPABASE_KEY} from "../myenv.js";

    /* -----------------------------------------
       SUPABASE CONNECTION (GLOBAL)
    ----------------------------------------- */

    window.supabaseUrl = SUPABASE_URL;
    window.supabaseKey = SUPABASE_KEY;
    window.supabase = createClient(window.supabaseUrl, window.supabaseKey);

    /* -----------------------------------------
       FETCH QUESTIONS FROM SUPABASE
    ----------------------------------------- */
    window.fetchQuestionsFromDB = async () => {
      const {data, error} = await window.supabase
        .from("mcqquestions")
        .select("*");

      if (error) {
        console.error("Supabase fetch error:", error);
        alert("Error loading questions from database.");
        return [];
      }

      return data;
    };

  </script>
</head>

<body>

  <!-- Hamburger -->
  <div id="hamburgerMenu" class="hamburgerIcon">☰</div>

  <!-- Dropdown Menu -->
  <div id="hamburgerMenuDropdown" class="dropdownMenu">

    <div class="dropdownSeparator"></div>

    <!-- NEW HOME LINK -->
    <div class="dropdownItem" onclick="window.location.href='index.html'">🏠 Home</div>

    <div class="dropdownItem" onclick="window.location.href='profile.html'">🧑‍⚕️ Profile</div>
    <div class="dropdownItem" onclick="window.location.href='rank.html'">🏅 Rank</div>

    <div class="dropdownSeparator"></div>

    <div class="dropdownItem" onclick="window.location.href='login.html'">🚪 Logout</div>
  </div>

  <!-- Top-right icons -->
  <div id="topRightIcons">
    <div id="rankIcon" class="topRightIcon" onclick="window.location.href='rank.html'">🏅</div>
    <div id="homeIcon" class="topRightIcon" onclick="window.location.href='index.html'">🏠</div>
    <div id="helpButton" class="topRightIcon" onclick="window.location.href='help.html'">❔</div>
  </div>

  <h1>Practice MCQs</h1>

  <div id="mcqArea">
    <label for="mcqCount">How many questions?</label>
    <input type="number" id="mcqCount" min="1" value="20">

    <label for="mcqAreas">Which subspecialty?</label>
    <select id="mcqAreas">
      <option value="all">All</option>
      <option value="Vascular">Vascular</option>
      <option value="Oncology">Oncology</option>
      <option value="Skull Base">Skull base</option>
      <option value="Trauma">Trauma</option>
      <option value="CSF">CSF</option>
      <option value="Spine">Spine</option>
      <option value="Paediatrics">Paediatrics</option>
      <option value="Peripheral Nerve">Peripheral Nerve</option>
      <option value="Functional">Functional & Pain</option>
      <option value="Epilepsy">Epilepsy</option>
    </select>

    <label for="mcqLevel">Level</label>
    <select id="mcqLevel">
      <option value="all">All</option>
      <option value="MRCS">MRCS</option>
      <option value="FRCS">FRCS</option>
    </select>

    <button id="startSubmitBtn" onclick="generateMCQs()">Submit</button>

    <div id="mcqquestions"></div>
    <div id="scoreDisplay"></div>

    <button id="closeBtn" onclick="window.location.href='index.html'">Close</button>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {

      /* -----------------------------------------
         LOGIN CHECK
      ----------------------------------------- */
      const token = localStorage.getItem("sessionToken");
      if (!token) {
        window.location.href = "login.html";
        return;
      }

      /* -----------------------------------------
         HAMBURGER MENU TOGGLE
      ----------------------------------------- */
      const hamburger = document.getElementById("hamburgerMenu");
      const dropdown = document.getElementById("hamburgerMenuDropdown");

      hamburger.addEventListener("click", () => {
        dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
      });

      document.addEventListener("click", (event) => {
        if (!hamburger.contains(event.target) && !dropdown.contains(event.target)) {
          dropdown.style.display = "none";
        }
      });

      /* -----------------------------------------
         SELECT OPTION
      ----------------------------------------- */
      window.selectOption = function (qIndex, optIndex, element) {
        const allOptions = document.querySelectorAll(`label.optionLabel[data-q="${qIndex}"]`);
        allOptions.forEach(opt => opt.classList.remove("selected"));
        element.classList.add("selected");

        const radio = element.querySelector("input[type='radio']");
        radio.checked = true;
      };

      /* -----------------------------------------
         STORE SCORE
      ----------------------------------------- */
      function storeScore(score, total, topic, level) {
        const now = new Date();
        const timestamp =
          now.getFullYear() + "-" +
          String(now.getMonth() + 1).padStart(2, "0") + "-" +
          String(now.getDate()).padStart(2, "0") + " " +
          String(now.getHours()).padStart(2, "0") + ":" +
          String(now.getMinutes()).padStart(2, "0");

        const entry = {score, total, topic, level, timestamp};

        let stored = localStorage.getItem("scores");
        let scores = stored ? JSON.parse(stored) : [];

        scores.push(entry);

        localStorage.setItem("scores", JSON.stringify(scores));
      }

      /* -----------------------------------------
         MCQ GENERATOR (FILTER + SHUFFLE)
      ----------------------------------------- */
      window.copilot = {
        generateMCQs: async ({count, topic, level}) => {
          let pool = await window.fetchQuestionsFromDB();

          pool = pool.map(q => {
            const options = [
              {text: q.option1, correct: true},
              {text: q.option2, correct: false},
              {text: q.option3, correct: false},
              {text: q.option4, correct: false}
            ];

            for (let i = options.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [options[i], options[j]] = [options[j], options[i]];
            }

            return {
              id: q.id,
              stem: q.stem,
              topic: q.topic,
              level: q.level,
              explanation: q.explanation,
              flaggedset: q.flaggedset,
              options: options.map(o => o.text),
              correctIndex: options.findIndex(o => o.correct)
            };
          });

          pool = pool.filter(q => (q.flaggedset || 0) < 5);

          if (topic !== "all") {
            pool = pool.filter(q => q.topic.toLowerCase().includes(topic.toLowerCase()));
          }

          if (level !== "all") {
            pool = pool.filter(q => q.level.toLowerCase().includes(level.toLowerCase()));
          }

          for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
          }

          return pool.slice(0, count);
        }
      };

      /* -----------------------------------------
         FLAG QUESTION
      ----------------------------------------- */
      window.flagQuestion = async function (questionId, buttonElement) {
        const {data, error} = await window.supabase
          .from("mcqquestions")
          .select("flaggedset")
          .eq("id", questionId)
          .single();

        if (error) {
          console.error("Error fetching flaggedset:", error);
          alert("Could not flag question.");
          return;
        }

        const current = data.flaggedset || 0;
        const updated = current + 1;

        const {error: updateError} = await window.supabase
          .from("mcqquestions")
          .update({flaggedset: updated})
          .eq("id", questionId)
          .single();

        if (updateError) {
          console.error("Error updating flaggedset:", updateError);
          alert("Could not update flag count.");
          return;
        }

        alert(`Question flagged (${updated}/5)`);
        buttonElement.style.display = "none";
      };

      /* -----------------------------------------
         GENERATE MCQs
      ----------------------------------------- */
      window.generateMCQs = async function () {
        const count = parseInt(document.getElementById("mcqCount").value);
        const topic = document.getElementById("mcqAreas").value;
        const level = document.getElementById("mcqLevel").value;

        if (!count || count < 1) {
          alert("Please enter a valid number of questions.");
          return;
        }

        const container = document.getElementById("mcqquestions");
        container.innerHTML = "";
        document.getElementById("scoreDisplay").innerHTML = "";

        document.getElementById("mcqCount").style.display = "none";
        document.getElementById("mcqAreas").style.display = "none";
        document.getElementById("mcqLevel").style.display = "none";
        document.getElementById("startSubmitBtn").style.display = "none";
        document.querySelector("label[for='mcqCount']").style.display = "none";
        document.querySelector("label[for='mcqAreas']").style.display = "none";
        document.querySelector("label[for='mcqLevel']").style.display = "none";

        let questions = await window.copilot.generateMCQs({count, topic, level});

        if (!questions || questions.length === 0) {
          alert("No questions available for that topic/level.");
          return;
        }

        questions.forEach((q, index) => {
          const block = document.createElement("div");
          block.className = "questionBlock";

          block.innerHTML = `
            <p><strong>Q${index + 1} (${q.level}):</strong> ${q.stem}</p>
            ${q.options.map((opt, j) => `
              <label class="optionLabel" data-q="${index}" onclick="selectOption(${index}, ${j}, this)">
                <input type="radio" name="q${index}" value="${j}">
                ${opt}
              </label>
            `).join("")}
          `;

          block.dataset.correct = q.correctIndex;
          block.dataset.explanation = q.explanation;
          block.dataset.id = q.id;

          container.appendChild(block);
        });

        const submitBtn = document.createElement("button");
        submitBtn.textContent = "Submit";

        submitBtn.onclick = () => {
          submitBtn.remove();
          scoresBtn.style.display = "inline-block";

          let score = 0;
          let scalpelDelta = 0;

          const blocks = document.querySelectorAll(".questionBlock");

          blocks.forEach((block, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const correct = block.dataset.correct;
            const explanation = block.dataset.explanation;

            const isCorrect = selected && selected.value === correct;

            if (isCorrect) {
              score++;
              scalpelDelta += 2;

              block.style.border = "2px solid #4CAF50";
              block.insertAdjacentHTML("beforeend",
                `<p class="resultTag" style="color:#4CAF50;"><strong>Correct (+2)</strong></p>`
              );

            } else {
              scalpelDelta -= 1;

              block.style.border = "2px solid #b30000";
              block.insertAdjacentHTML("beforeend",
                `<p class="resultTag" style="color:#b30000;"><strong>Wrong (-1)</strong></p>`
              );
            }

            if (!block.querySelector(".explanation")) {
              const explanationDiv = document.createElement("div");
              explanationDiv.className = "explanation";
              explanationDiv.innerHTML = `<strong>Explanation:</strong> ${explanation}`;
              block.appendChild(explanationDiv);
            }

            const flagBtn = document.createElement("button");
            flagBtn.textContent = "Flag Question";
            flagBtn.className = "flagBtn";
            flagBtn.onclick = () => flagQuestion(block.dataset.id, flagBtn);
            block.appendChild(flagBtn);
          });

          let currentPoints = parseInt(localStorage.getItem("scalpelPoints")) || 0;
          let newPoints = currentPoints + scalpelDelta;
          localStorage.setItem("scalpelPoints", String(newPoints));

          document.getElementById("scoreDisplay").innerHTML =
            `<p><strong>Score:</strong> ${score}/${questions.length}</p>
             <p><strong>Points change:</strong> ${scalpelDelta > 0 ? "+" : ""}${scalpelDelta}</p>
             <p><strong>New total:</strong> ${newPoints}</p>`;

          storeScore(score, questions.length, topic, level);
        };

        container.appendChild(submitBtn);

        const scoresBtn = document.createElement("button");
        scoresBtn.textContent = "Progress";
        scoresBtn.style.display = "none";
        scoresBtn.onclick = () => window.location.href = "scores.html";

        container.appendChild(scoresBtn);
      };
    });
  </script>

</body>

</html>
